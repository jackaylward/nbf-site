<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Bridge Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#012060">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" sizes="32x32" href="icon-32.png">
<link rel="icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="config.js"></script>
<style>
:root{
  color-scheme: light;
  --brand:#012060; --ink:#111827; --muted:#6a7180; --bg:#f4f6fa; --card:#ffffff;
  --line:#e1e6ef; --soft:#f2f5fa; --ok:#1b7a44; --warn:#b3261e; --amber:#b86a12; --yellow:#ffe600;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  --rail:0px; --top:60px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{font-family:"Barlow Condensed",sans-serif;margin:0;letter-spacing:.02em}
a{color:inherit}

/* ---------- frame: phone first ---------- */
header.top{position:sticky;top:0;z-index:5;height:var(--top);background:var(--brand);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px}
.logo{height:30px;width:auto;max-width:160px;object-fit:contain;display:block}
.logo.chip{background:#fff;border-radius:6px;padding:3px 6px}
.viewtitle{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.15rem;text-transform:uppercase;letter-spacing:.08em;opacity:.75;white-space:nowrap}
.status{margin-left:auto;font-size:.78rem;color:rgba(255,255,255,.7);text-align:right;max-width:45%}
.status.ok{color:#9be3b6}
.brandname{display:none}
main{padding:18px 16px 110px;max-width:1240px;margin:0 auto}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--brand);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .navlogo{display:none}
nav.tabs .lg{display:none}
nav.tabs button{flex:1;max-width:120px;border:0;background:none;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(255,255,255,.55);font-size:.68rem;font-weight:600;letter-spacing:.02em;cursor:pointer;border-radius:10px;position:relative}
nav.tabs svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:#fff;background:rgba(255,255,255,.1)}
nav.tabs button[data-badge]:not([data-badge=""])::after{content:attr(data-badge);position:absolute;top:2px;right:calc(50% - 22px);background:#f59e0b;color:#111;border-radius:999px;font-size:.66rem;font-weight:700;padding:0 5px;line-height:1.5}

/* ---------- tablet: side rail ---------- */
@media (min-width:760px){
  :root{--rail:92px}
  nav.tabs{top:0;bottom:0;right:auto;width:var(--rail);flex-direction:column;justify-content:flex-start;gap:4px;padding:14px 8px}
  nav.tabs button{flex:0 0 auto;max-width:none;padding:10px 2px;font-size:.72rem}
  header.top,main{margin-left:var(--rail)}
  header.top{padding:0 24px}
  main{padding:24px 24px 60px}
}
/* ---------- laptop: full sidebar ---------- */
@media (min-width:1100px){
  :root{--rail:232px;--top:76px}
  nav.tabs{padding:22px 14px;gap:2px}
  nav.tabs .navlogo{display:block;padding:4px 10px 26px}
  nav.tabs .lg{display:inline}
  nav.tabs .navlogo img{width:100%;height:auto;max-width:190px}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:14px;padding:12px 14px;font-size:.98rem;letter-spacing:.01em}
  nav.tabs button[aria-current="page"]{background:#fff;color:var(--brand)}
  nav.tabs button[data-badge]:not([data-badge=""])::after{position:static;margin-left:auto}
  header.top{background:transparent;color:var(--ink);border-bottom:1px solid var(--line);background:var(--bg)}
  header.top .logo{display:none}
  .viewtitle{font-size:2rem;opacity:1;letter-spacing:.05em}
  .status{color:var(--muted)}
  .status.ok{color:var(--ok)}
  main{padding:28px 36px 60px}
}

/* ---------- building blocks ---------- */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--brand);background:var(--brand);color:#fff;font-weight:600;font-size:.98rem;padding:10px 16px;border-radius:10px;cursor:pointer;transition:transform .08s,background .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{box-shadow:0 4px 12px rgba(0,0,0,.15)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:var(--card);color:var(--warn);border-color:#efc4c0}
.btn:disabled{opacity:.5}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.76rem;font-weight:700;letter-spacing:.02em;background:var(--soft);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.warn{background:#fdecea;color:var(--warn);border-color:#f5c6c2}
.pill.amber{background:#fff3e0;color:var(--amber);border-color:#f3d5ae}
.pill.ok{background:#e7f5ec;color:var(--ok);border-color:#c3e5d0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.panel h2{font-size:1.35rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.msg{margin:8px 0 0;font-size:.9rem;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.field input,.field select,.field textarea{font-size:1rem;color:var(--ink);padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-weight:400;text-transform:none;letter-spacing:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);outline:none}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;min-width:46px;height:40px;border-radius:9px;cursor:pointer;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.02rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:0 10px}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.seg button.arrow{font-size:1.3rem}
.seg span{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.1rem;padding:0 8px;align-self:center;letter-spacing:.03em}
.count{display:flex;align-items:baseline;gap:10px;margin:0 2px 14px}
.count b{font-family:"Barlow Condensed",sans-serif;font-size:3rem;line-height:1}
.greet{margin:0;font-size:1rem}

/* home */
.hero{background:var(--brand);color:#fff;border-radius:18px;padding:22px 22px 18px;margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border:28px solid rgba(255,255,255,.05);border-radius:50%;pointer-events:none}
.hero .top-row{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.hero h1{font-size:2rem;text-transform:uppercase;letter-spacing:.05em;line-height:1}
.hero .greet{color:rgba(255,255,255,.65);margin-top:4px}
.hero .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.hero .btn.ghost:hover{border-color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px;position:relative;z-index:1}
.stat{border-top:1px solid rgba(255,255,255,.18);padding-top:10px;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;color:#fff;text-align:left}
.stat b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:2.6rem;line-height:1}
.stat span{font-size:.8rem;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.06em}
.stat .ot{margin:0;font-size:.8rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;background:var(--card);text-align:left;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.card h3{font-size:.95rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.card .big{font-family:"Barlow Condensed",sans-serif;font-size:2.8rem;font-weight:700;line-height:1.1}
.card p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
@media (max-width:520px){ .stat b{font-size:2rem} .hero h1{font-size:1.6rem} }

/* groups of lads */
.group{margin-bottom:16px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.group h2{flex-wrap:wrap;padding:12px 16px;font-size:1.15rem;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);position:relative}
.group h2::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c);display:inline-block;margin-right:10px;align-self:center;flex:0 0 auto}
.group h2 .gname{margin-right:auto;color:var(--ink)}
.group h2 span{color:var(--muted);font-weight:600;white-space:nowrap}
.lads{display:grid;grid-template-columns:1fr}
.lad{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.av{flex:0 0 52px;height:52px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--ink);font-size:1.05rem;border:2px solid var(--c);overflow:hidden;cursor:pointer;padding:0}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.who{flex:1;min-width:0}
.who strong{display:block;font-weight:600;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who em{font-style:normal;color:var(--muted);font-size:.86rem}
.tick{flex:0 0 auto;width:52px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;transition:background .12s,border-color .12s}
.tick:hover{border-color:var(--ink)}
.tick svg{width:28px;height:28px;opacity:0;stroke:#fff}
.tick[aria-pressed="true"]{background:var(--brand);border-color:var(--brand)}
.tick[aria-pressed="true"] svg{opacity:1}
.weekrow{display:flex;gap:4px}
.weekrow .tick{width:40px;height:40px;border-radius:9px}
.weekrow .tick svg{width:20px;height:20px}
.dayhead{display:flex;gap:4px;padding:6px 14px;justify-content:flex-end;border-bottom:1px solid var(--line);color:var(--muted);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.dayhead span{width:40px;text-align:center}
.rm{flex:0 0 auto}
@media (min-width:760px){
  .lads.day{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .lads.day .lad{border-right:1px solid var(--line)}
}
@media (max-width:560px){
  .weekrow .tick{width:32px;height:32px}.dayhead span{width:32px}
  .weekrow .tick svg{width:17px;height:17px}
  .av{flex-basis:44px;height:44px}
}

/* timesheet */
.ts-lad{padding:12px 14px;border-bottom:1px solid var(--line)}
.ts-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ts-top .tot{margin-left:auto;text-align:right;font-weight:600;white-space:nowrap}
.ts-top .tot b{font-family:"Barlow Condensed",sans-serif;font-size:1.5rem}
.ot{display:inline-block;margin-left:6px;background:var(--yellow);color:#111;border-radius:6px;padding:0 6px;font-size:.85rem;font-weight:700}
.hours{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.hours label{display:flex;flex-direction:column;align-items:center;font-size:.68rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;gap:3px}
.hours input{color:var(--ink);width:100%;min-width:0;text-align:center;font-size:1.05rem;padding:10px 2px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.hours input:focus{border-color:var(--ink);outline:none}
.hours input.over{background:var(--yellow);border-color:#e0c900;font-weight:700}
.hours input.bad{border-color:var(--warn)}
.notes{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:.9rem;color:var(--ink);background:var(--card)}
.ts-total{flex-wrap:wrap;gap:6px 12px;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--brand);color:#fff;border-radius:var(--radius);font-weight:600;margin:0 0 16px;text-transform:uppercase;letter-spacing:.05em}
.ts-total b{font-family:"Barlow Condensed",sans-serif;font-size:2rem;letter-spacing:0}
@media (min-width:1100px){
  .ts-lad{display:grid;grid-template-columns:minmax(340px,1.3fr) minmax(360px,1.6fr) minmax(150px,.8fr);gap:16px;align-items:center}
  .ts-top{margin:0}
  .notes{margin:0}
}

.grow{flex:1 1 0}
.tsbar .controls{row-gap:12px}
.tsbar .btn{height:44px}
.controls .btn{height:44px}

/* tools and records lists */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input,.toolbar select{padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:1rem;background:var(--card)}
.toolbar input{flex:1;min-width:180px}
.list{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:1000px){ .list{grid-template-columns:repeat(2,1fr)} }
@media (min-width:1500px){ .list{grid-template-columns:repeat(3,1fr)} }
.tool{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);cursor:pointer;width:100%;text-align:left;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s}
.tool:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.thumb{flex:0 0 72px;height:72px;border-radius:10px;background:var(--soft);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:.7rem}
.thumb img{width:100%;height:100%;object-fit:cover}
.tool .info{flex:1;min-width:0}
.tool .info strong{display:block;font-size:1.05rem}
.tool .info span{display:block;color:var(--muted);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool .info .serial,.serial{display:inline;font-weight:700;color:var(--ink)}
.tool .info .serial.check,.serial.check{color:var(--amber)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.photo{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--soft)}
.photo .pic{aspect-ratio:1/1;display:grid;place-items:center;color:var(--muted);font-size:.85rem}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo button{width:100%;border:0;border-top:1px solid var(--line);background:var(--card);padding:9px;cursor:pointer;font-weight:600}
@media (min-width:1100px){ .photos{max-width:640px} }

/* dayworks / works done */
.qbar{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:12px;padding:11px 16px;margin-bottom:14px;font-weight:600;font-size:.92rem}
.qbar.ok{background:#e7f5ec;color:var(--ok)}
.qbar.wait{background:#fff3e0;color:#7a4a0e}
.dwdate{font-size:.9rem;color:var(--muted);margin:14px 2px 2px;text-transform:uppercase;letter-spacing:.08em;grid-column:1/-1}
.tool.dw{align-items:flex-start}
.tool.dw .info span{white-space:normal}
.tool.dw .info span:last-child{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dwside{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}
.dwside b{font-family:"Barlow Condensed",sans-serif;font-size:1.8rem;line-height:1}
.dwcalc{margin:10px 0 0;color:var(--muted)}
.dwcalc b{color:var(--ink)}
.dwphotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.dwph{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--soft);display:grid;place-items:center;border:1px solid var(--line)}
.dwph img{width:100%;height:100%;object-fit:cover;display:block}
.dwph button{position:absolute;top:5px;right:5px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;cursor:pointer;font-size:.9rem}
.dwadd{aspect-ratio:1/1;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;cursor:pointer;font-weight:700;text-align:center;padding:6px}
.dwadd:hover{border-color:var(--ink)}
.dwmiss{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:#fdecea;color:var(--warn);font-weight:600}
.field input.bad,.field textarea.bad{border-color:var(--warn);background:#fff8f7}
.dwtable{width:100%;border-collapse:collapse;margin-top:6px}
.dwtable th,.dwtable td{text-align:left;vertical-align:top;padding:10px;border-bottom:1px solid var(--line)}
.dwtable th{width:32%;color:var(--muted);font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;background:var(--soft)}
.pdfout{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 16px;background:var(--card)}
.pdfout.bad{color:var(--warn);background:#fdecea;border-color:#f5c6c2}
.pdfout a:not(.btn){font-weight:700}
.hero .pdfout{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff;margin:14px 0 0;position:relative;z-index:1}
.hero .pdfout .btn.ghost{color:#fff}

/* loading */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
@keyframes slide{0%{left:-40%}100%{left:100%}}
.spin{display:inline-block;width:22px;height:22px;border:3px solid rgba(0,0,0,.12);border-top-color:var(--ink);border-radius:50%;animation:spin .75s linear infinite;flex:0 0 auto;vertical-align:middle}
.spin.sm{width:14px;height:14px;border-width:2px;margin-right:6px}
.spin.light{border-color:rgba(255,255,255,.2);border-top-color:#fff}
.loading{display:flex;align-items:center;justify-content:center;gap:12px;padding:48px 16px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.skel{display:block;border-radius:8px;background:linear-gradient(90deg,#e6ebf4 25%,#f4f7fc 50%,#e6ebf4 75%);background-size:300% 100%;animation:shimmer 1.3s ease-in-out infinite}
.hero .skel{background:linear-gradient(90deg,rgba(255,255,255,.08) 25%,rgba(255,255,255,.18) 50%,rgba(255,255,255,.08) 75%);background-size:300% 100%}
.skel.num{height:40px;width:70%;margin:4px 0 6px}
.skel.line{height:12px;width:85%;margin-top:6px}
.av.skel,.thumb.skel,.pic.skel,.dwph.skel{border-color:transparent}
.av.skel{border-radius:50%}
.tick.wait{pointer-events:none;background:linear-gradient(90deg,#e6ebf4 25%,#f4f7fc 50%,#e6ebf4 75%);background-size:300% 100%;animation:shimmer 1.3s ease-in-out infinite;border-color:transparent}
#topbar{display:none}
#splash{position:fixed;inset:0;z-index:50;background:#012060;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .35s}
#splash img{width:min(60vw,280px);height:auto}
#splash.gone{opacity:0;pointer-events:none}
.status .spin{border-color:rgba(255,255,255,.25);border-top-color:#fff}
@media (min-width:1100px){ .status .spin{border-color:rgba(0,0,0,.12);border-top-color:#012060} }

/* credit */
.credit{font-size:.66rem;letter-spacing:.04em;color:#a3a3a3;text-align:center;margin:28px 0 0;opacity:.8}
nav.tabs .navcredit{display:none}
@media (min-width:1100px){
  nav.tabs .navcredit{display:block;margin-top:auto;padding:12px 10px 0;font-size:.66rem;letter-spacing:.04em;color:rgba(255,255,255,.3);line-height:1.4}
  .credit{display:none}
}

/* view and edit mode, log, list photos */
.modebar{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.modebar.editing{background:var(--brand);border-color:var(--brand);color:#fff}
.modebar.editing .btn{background:#fff;color:var(--brand);border-color:#fff}
.modebar .btn{padding:8px 14px;font-size:.85rem}
input[readonly],textarea[readonly]{background:var(--soft);color:var(--muted);cursor:pointer}
.tick.locked{opacity:.5}
.logrow{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.logrow:last-child{border-bottom:0}
.logrow .when{flex:0 0 104px;color:var(--muted);font-size:.78rem}
.logrow b{white-space:nowrap}
.dwthumbs{display:flex;gap:5px;margin-top:8px}
.dwthumbs img,.dwthumbs .skel{width:56px;height:56px;border-radius:8px;object-fit:cover;display:block;border:1px solid var(--line)}
@media (max-width:620px){ .tool.dw{flex-wrap:wrap} .tool.dw .info{flex:1 1 60%} .dwthumbs{order:3;width:100%;margin-top:6px} }

.tag{display:inline-block;margin:0 0 4px;padding:2px 9px;border-radius:6px;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tag.var{background:#dce6f2;color:#012060}
.tag.crane{background:#ffe8cc;color:#8a4b0f}
.tag.big{font-size:.8rem;padding:4px 12px;margin-bottom:8px}
.tool .info .tag{display:inline-block;width:auto}

/* dialog */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:20;padding:16px}
.modal .box{background:#fff;border-radius:16px;padding:22px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal p{margin:0 0 16px;font-size:1.02rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* pours */
.pourwrap{display:grid;gap:14px}
@media (min-width:1000px){.pourwrap{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
.plancard{position:relative;border:1px solid var(--line);border-radius:var(--radius);background:#fbfcfe;overflow:hidden;box-shadow:var(--shadow)}
.plancard svg{display:block;width:100%;height:62vh;min-height:320px;touch-action:none;user-select:none;-webkit-user-select:none}
.plantools{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.plantools button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:1.2rem;font-weight:700;color:var(--brand);cursor:pointer}
.plankey{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:0 0 12px;font-size:.88rem}
.plankey i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.pourcount{font-family:"Barlow Condensed",sans-serif;font-size:1.6rem;font-weight:700;color:var(--brand)}
.pourpanel{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:16px 18px;box-shadow:var(--shadow)}
.pourpanel h2{font-size:1.7rem;color:var(--brand)}
.pourpanel .grid2{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0 14px;font-size:.95rem}
.pourpanel .grid2 span:nth-child(odd){color:var(--muted)}
.pourpanel .field{margin-bottom:12px}
.pourphotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 12px}
.pourphotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--soft);cursor:zoom-in}
.pourbig{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center}
.pourbig img{max-width:96vw;max-height:90vh}
</style>
</head>

<script>
// ================= constants =================
const DEFAULT_LOGO = document.getElementById("logoBlack").src;
const WHITE_LOGO = document.getElementById("logo").src;
const BUILTIN_PHOTOS = {};
const AG_COLORS = {"DCOR Construction":"#012060","Talcon Group":"#1F6FB2","Adebura":"#2E7D4F","Dragos":"#7B3FA0","Petru Pirtac":"#B03A5B","Aitken":"#2F6F7A"};
const AG_ORDER = Object.keys(AG_COLORS);
// trades: these are the defaults; the real list comes from the Settings tab of the timesheet
let TRADES = [["SM","Site Manager"],["SR","Safety Rep"],["FFM","Fixing Foreman"],["C","Chippy"],["SF","Steel Fixer"],["CF","Concrete Finisher"],["GO","General Operative"],["BM","Banksman"]];
let TRADE_LABEL = Object.fromEntries(TRADES);
let TRADE_RANK = Object.fromEntries(TRADES.map(([c],i)=>[c,i]));
function setTrades(list){
  if (!Array.isArray(list) || !list.length) return;
  TRADES = list.map(([c, n]) => [String(c), String(n || c)]);
  TRADE_LABEL = Object.fromEntries(TRADES);
  TRADE_RANK = Object.fromEntries(TRADES.map(([c],i)=>[c,i]));
}
const DAYS = ["mon","tue","wed","thu","fri","sat"];
const DAY_LABEL = ["Mon","Tue","Wed","Thu","Fri","Sat"];
const STATUSES = ["In store","On site","With a lad","In repair","Off hired","Missing"];
const TICK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const VIEW_TITLES = {home:"Home", attendance:"Attendance", timesheet:"Timesheet", dayworks:"Variations", pours:"Pours", works:"Works Done", talks:"Toolbox Talks", tools:"Tools"};

// ================= helpers =================
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-");
const initials = n => String(n).replace(/-/g," ").split(" ").filter(Boolean).slice(0,2).map(p=>p[0]).join("").toUpperCase();
function mondayOf(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fromIso = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s||""); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };
const nice = d => d.toLocaleDateString("en-IE",{day:"numeric",month:"short"});
const fmtH = n => (Math.round(n*10)/10).toFixed(1);
function setStatus(t, ok){
  const el = $("status");
  el.innerHTML = (/…$/.test(t) ? '<span class="spin sm"></span>' : "") + esc(t);
  el.classList.toggle("ok", !!ok);
}
const HAS_GAS = !!(window.google && google.script && google.script.run);
const API_URL = String(window.SITE_APP_API || "").trim();
function getPin(){ try{ return localStorage.getItem("siteAppPin") || ""; }catch(e){ return ""; } }
function getWho(){ try{ return localStorage.getItem("siteAppWho") || ""; }catch(e){ return ""; } }
function askWho(){
  if (getWho() || document.getElementById("whoForm")) return;
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<form class="box" id="whoForm"><h2 style="text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Who's using this?</h2>
    <p class="muted">Your name goes on the change log, so everyone can see who changed what.</p>
    <input id="whoBox" autocomplete="name" placeholder="e.g. Jack" style="width:100%;font-size:1.1rem;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px">
    <button class="btn" style="width:100%">Start</button></form>`;
  document.body.appendChild(m);
  $("whoBox").focus();
  $("whoForm").onsubmit = ev => {
    ev.preventDefault();
    const v = $("whoBox").value.trim().slice(0, 40);
    if (!v) return;
    try{ localStorage.setItem("siteAppWho", v); }catch(e){}
    m.remove();
  };
}
let pinAsked = false;
function askPin(message){
  if (pinAsked) return;
  pinAsked = true;
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<form class="box" id="pinForm"><h2 style="text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Enter the app PIN</h2>
    <p class="muted">${esc(message || "Ask Jack for the PIN.")}</p>
    <input id="pinBox" type="password" inputmode="numeric" autocomplete="off" style="width:100%;font-size:1.4rem;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px">
    <button class="btn" style="width:100%">Open the app</button></form>`;
  document.body.appendChild(m);
  $("pinBox").focus();
  $("pinForm").onsubmit = ev => {
    ev.preventDefault();
    try{ localStorage.setItem("siteAppPin", $("pinBox").value.trim()); }catch(e){}
    location.reload();
  };
}
let inflight = 0;
function busy(delta){ inflight = Math.max(0, inflight + delta); }
let lastOk = 0, failStreak = 0;
const isNetworkError = e => /signal|connection|network|fetch|unavailable/i.test((e && e.message) || "");
function tracked(p){
  return p.then(r => { lastOk = Date.now(); failStreak = 0; return r; },
    e => { if (e && e.code !== "PIN") failStreak++; throw e; });
}
// one quiet retry: site signal drops for a second all the time
function withRetry(fn, args){
  return rawServer(fn, ...args).catch(e => {
    if (e && (e.code === "PIN" || !isNetworkError(e))) throw e;
    return new Promise(r => setTimeout(r, 1200)).then(() => rawServer(fn, ...args));
  });
}
function server(fn, ...args){
  busy(1);
  return tracked(withRetry(fn, args)).finally(() => busy(-1));
}
function bgServer(fn, ...args){ return tracked(withRetry(fn, args)); }
// only worth telling them about if nothing has worked for a while
function connectionTrouble(msg){
  if (failStreak >= 2 && Date.now() - lastOk > 15000) setStatus(msg || "No signal. Using the saved copy");
}
function rawServer(fn, ...args){
  if (HAS_GAS){
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
  }
  if (!API_URL) return Promise.reject(new Error("The app isn't linked to Google yet. Put the web app link in config.js."));
  return fetch(API_URL, {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify({fn, args, pin: getPin(), who: getWho()}),
    redirect: "follow",
  }).then(r => {
    if (!r.ok) throw new Error("No connection to Google right now.");
    return r.json();
  }).then(j => {
    if (j && j.ok) return j.result;
    const e = new Error((j && j.error) || "Something went wrong.");
    if (j && j.code === "PIN"){ e.code = "PIN"; clearCache(); askPin(j.error); }
    throw e;
  }, e => { if (e.code === "PIN") throw e; throw new Error(e && e.message && !/fetch/i.test(e.message) ? e.message : "No signal. Check your connection."); });
}
const errText = (e, fallback) => (e && e.message) ? e.message.replace(/^Error:\s*/,"") : fallback;
let saveQueue = Promise.resolve(), pending = 0;
function queueSave(fn, okText){
  pending++; setStatus("Saving…");
  saveQueue = saveQueue.then(fn).then(() => { pending--; if (!pending) setStatus(okText || "Saved", true); })
    .catch(e => { pending--; setStatus(errText(e, "Couldn't save. Check your signal and try again")); });
  return saveQueue;
}
function ask(message, okLabel, danger){
  return new Promise(resolve => {
    const m = document.createElement("div");
    m.className = "modal";
    m.innerHTML = `<div class="box" role="dialog" aria-modal="true"><p>${esc(message)}</p><div class="row-actions">
      <button class="btn ${danger ? "danger" : ""}" data-a="ok">${esc(okLabel)}</button><button class="btn ghost" data-a="no">Cancel</button></div></div>`;
    m.onclick = ev => { const a = ev.target.dataset.a; if (a || ev.target === m){ m.remove(); resolve(a === "ok"); } };
    document.body.appendChild(m);
    m.querySelector("[data-a=ok]").focus();
  });
}
function shrinkImage(file, size, square){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      if (square){
        const s = Math.min(img.width, img.height);
        c.width = c.height = size;
        c.getContext("2d").drawImage(img, (img.width-s)/2, Math.max(0,(img.height-s)/3), s, s, 0, 0, size, size);
      } else {
        const k = Math.min(1, size / Math.max(img.width, img.height));
        c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      }
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", square ? 0.82 : 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("That file isn't a photo.")); };
    img.src = url;
  });
}
function pickImage(){
  return new Promise(resolve => {
    const p = $("picker");
    p.value = "";
    p.onchange = () => resolve(p.files && p.files[0] ? p.files[0] : null);
    p.click();
  });
}

function buildLads(d){
  const seen = new Set();

    const code = String(l.trade||"").trim();

      hours: (l.hours || []).slice(0,6), notes: l.notes || "", order: i};
  }).filter(l => l.name && !seen.has(l.id) && seen.add(l.id));
  const rank = a => { const i = AG_ORDER.indexOf(a); return i < 0 ? 50 : i; };
  lads.sort((x,y) => rank(x.agency)-rank(y.agency) || x.agency.localeCompare(y.agency) || x.rank-y.rank || x.order-y.order);
  return {lads, agencies: [...new Set(lads.map(l => l.agency))].map(a => [a, AG_COLORS[a] || "#5F6B7A"])};

function ladTotals(l){
  const h = l.hours.map(x => typeof x === "number" ? x : 0);
  return {sum: h.reduce((a,b)=>a+b,0), ot: h.reduce((a,x)=>a+Math.max(0,x-S.paidHours),0)};
}

  const list = S.pastWeeks || [];
  return `<label class="field">Past weeks<select id="pastPick" aria-label="Open a past week">
    <option value="">This week</option>${list.map(w => `<option value="${esc(w.week)}"${S.past && S.past.week === w.week ? " selected" : ""}>Week starting ${esc(w.label)}</option>`).join("")}
  </select></label>`;
}

function refreshTotals(l, row){
  const lt = ladTotals(l);

  const o = row.querySelector("[data-ot]"); o.textContent = fmtH(lt.ot) + " OT"; o.hidden = !(lt.ot > 0);
  const lads = S.lads.filter(x => x.agency === l.agency);
  const aSum = lads.reduce((a,x)=>a+ladTotals(x).sum,0), aOt = lads.reduce((a,x)=>a+ladTotals(x).ot,0);
  const ag = [...document.querySelectorAll("[data-agsum]")].find(e => e.dataset.agsum === l.agency);
  if (ag) ag.textContent = `${fmtH(aSum)} hrs${aOt > 0 ? `, ${fmtH(aOt)} OT` : ""}`;
  const t = weekTotals();
  $("grandSum").textContent = fmtH(t.hours);
  $("grandOt").textContent = fmtH(t.ot) + " OT"; $("grandOt").hidden = !(t.ot > 0);

$("view").addEventListener("change", async ev => {
  if (S.view !== "timesheet") return;
  const el = ev.target;
  if (el.id === "pastPick"){ openPast(el.value); return; }
  const row = el.closest("[data-lad]");
  if (el.id === "paidHours"){
    const v = Number(el.value.replace(",", "."));
    if (!(v > 0 && v <= 24)){ setStatus("Paid hours must be between 0 and 24"); return; }
    setStatus("Saving…");
    try{ setLadData(await server("setPaidHours", v)); render(); setStatus("Paid hours saved", true); }
    catch(e){ setStatus(errText(e, "Couldn't save paid hours")); }
    return;
  }
  if (el.id === "tsWeek"){
    if (!el.value) return;
    setStatus("Saving…");
    try{ setLadData(await server("setWeekStart", el.value)); setStatus("Week starting saved", true); }
    catch(e){ setStatus(errText(e, "Couldn't save the date")); }
    return;
  }
  if (!row) return;
  const lad = S.lads.find(l => l.id === row.dataset.lad);
  if (!lad) return;
  if (el.dataset.h != null){
    const i = Number(el.dataset.h);
    const raw = el.value.trim().replace(",", ".");
    const v = raw === "" ? "" : Number(raw);
    if (v !== "" && !(v >= 0 && v <= 24)){ el.classList.add("bad"); setStatus("Hours must be between 0 and 24"); return; }
    el.classList.remove("bad");
    el.value = v === "" ? "" : v;
    el.classList.toggle("over", v !== "" && v > S.paidHours);
    lad.hours[i] = v;
    refreshTotals(lad, row);
    queueSave(() => server("setHours", lad.name, DAYS[i], v));
  }
  if (el.hasAttribute("data-notes")){
    lad.notes = el.value;
    queueSave(() => server("setNotes", lad.name, el.value));
  }
});

// ================= dayworks and works done =================
// Every save goes into a queue on this device first (IndexedDB), then is sent to Google.
// A record only leaves the queue once Google confirms the record AND every photo is in Drive.
const DWQ = {db: null, mem: new Map(), ready: null, busy: false, failed: ""};
DWQ.ready = new Promise(resolve => {
  try{
    const req = indexedDB.open("site-app", 1);
    req.onupgradeneeded = () => { const d = req.result; d.createObjectStore("jobs", {keyPath: "key"}); d.createObjectStore("kv"); };
    req.onsuccess = () => { DWQ.db = req.result; resolve(); };
    req.onerror = () => resolve();
  }catch(e){ resolve(); }
});
function idb(store, mode, fn){
  return new Promise((resolve, reject) => {
    const tx = DWQ.db.transaction(store, mode);
    const st = tx.objectStore(store);
    let out;
    Promise.resolve(fn(st)).then(r => { out = r; });
    tx.oncomplete = () => resolve(out);
    tx.onerror = () => reject(tx.error || new Error("Storage error"));
    tx.onabort = () => reject(tx.error || new Error("Storage full"));
  });
}
const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function jobsAll(){
  await DWQ.ready;
  if (!DWQ.db) return [...DWQ.mem.values()].filter(j => j && j.key && !String(j.key).startsWith("kv:")).sort((a,b)=>a.ts-b.ts);
  const all = await idb("jobs", "readonly", st => reqP(st.getAll()));
  return (all || []).map(j => ({kind: "dayworks", ...j})).sort((a,b)=>a.ts-b.ts);
}
async function jobPut(job){ await DWQ.ready; if (!DWQ.db){ DWQ.mem.set(job.key, job); return; } await idb("jobs", "readwrite", st => reqP(st.put(job))); }
async function jobGet(key){
  await DWQ.ready;
  if (!DWQ.db) return DWQ.mem.get(key) || null;
  const j = await idb("jobs", "readonly", st => reqP(st.get(key)));
  return j ? {kind: "dayworks", ...j} : null;
}
async function jobDel(key){ await DWQ.ready; if (!DWQ.db){ DWQ.mem.delete(key); return; } await idb("jobs", "readwrite", st => reqP(st.delete(key))); }
async function kvSet(k, v){ await DWQ.ready; if (!DWQ.db){ DWQ.mem.set("kv:"+k, v); return; } await idb("kv", "readwrite", st => reqP(st.put(v, k))); }
async function kvGet(k){ await DWQ.ready; if (!DWQ.db) return DWQ.mem.get("kv:"+k) || null; return (await idb("kv", "readonly", st => reqP(st.get(k)))) || null; }

const toMin = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(t||""); return m ? (+m[1])*60 + (+m[2]) : -1; };
const dwHours = r => { const s = toMin(r.start), e = toMin(r.end); return s >= 0 && e > s ? Math.round((e-s)/60*100)/100 : 0; };
const recMen = r => (+r.chippies||0) + (+r.fixers||0) + (+r.operatives||0);
const wdDays = r => { const a = fromIso(r.dateFrom), b = fromIso(r.dateTo || r.dateFrom); return a && b && b >= a ? Math.round((b - a)/86400000) + 1 : 0; };
function menText(r){
  const p = (n, one, many) => n ? `${n} ${n == 1 ? one : many}` : "";
  const bits = [p(+r.chippies,"Chippy","Chippies"), p(+r.fixers,"Fixer","Fixers"), p(+r.operatives,"General Operative","General Operatives")].filter(Boolean);
  return bits.join(", ") + (r.other ? ` (${r.other})` : "");

async function queueRecordSave(kind, rec, newPhotos, removed){
  const key = "save:" + rec.id;
  const old = await jobGet(key);
  const job = old || {key, kind, id: rec.id, ts: Date.now(), newPhotos: [], removed: []};
  job.kind = kind;
  job.rec = rec;
  for (const p of newPhotos) job.newPhotos.push({name: p.name, data: p.data, sent: false});
  for (const name of removed){
    const i = job.newPhotos.findIndex(p => p.name === name);
    if (i >= 0) job.newPhotos.splice(i, 1);
    else if (!job.removed.includes(name)) job.removed.push(name);
  }
  await jobPut(job);
  await refreshJobs();
  processQueue();
}
async function queueRecordDelete(kind, id){
  await jobDel("save:" + id);
  await jobPut({key: "delete:" + id, kind, id, ts: Date.now(), del: true});
  await refreshJobs();
  processQueue();
}
function sameRec(K, a, b){
  return K.textFields.every(k => k === "dateTo"
      ? String(a[k] || a.dateFrom || "").trim() === String(b[k] || b.dateFrom || "").trim()
      : String(a[k]||"").trim() === String(b[k]||"").trim()) &&
    ["chippies","fixers","operatives"].every(k => Number(a[k]||0) === Number(b[k]||0));
}
async function processQueue(){
  if (DWQ.busy) return;
  DWQ.busy = true; updateQueueBadges();
  try{
    for (const job of await jobsAll()){
      const kind = job.kind || "dayworks", K = KINDS[kind], st = RS(kind);
      if (job.del){
        await server("deleteRecord", kind, job.id);
        await jobDel(job.key);
        if (st.list) st.list = st.list.filter(r => r.id !== job.id);
        continue;
      }
      const saved = await server("saveRecord", kind, job.rec);
      if (!sameRec(K, saved, job.rec)) throw new Error("Google saved something different. Retrying.");
      for (const name of job.removed) await server("removeRecordPhoto", kind, job.id, name);
      // two photos at a time: quicker on site, still safe
      const toSend = job.newPhotos.filter(p => !p.sent);
      for (let i = 0; i < toSend.length; i += 2){
        const pair = toSend.slice(i, i + 2);
        await Promise.all(pair.map(p => server("saveRecordPhoto", kind, job.id, p.name, p.data).then(() => { p.sent = true; })));
        await jobPut(job);
        await refreshJobs();
      }
      const fin = await server("finalizeRecord", kind, job.id);
      const missing = job.newPhotos.filter(p => !fin.names.includes(p.name));
      const stillThere = job.removed.filter(n => fin.names.includes(n));
      if (missing.length || stillThere.length){
        missing.forEach(p => p.sent = false);
        await jobPut(job);
        throw new Error(`${missing.length} photo${missing.length===1?"":"s"} didn't reach Drive. Retrying.`);
      }
      // only now is it safe to forget the local copy
      const latest = await jobGet(job.key);
      if (latest && latest.rec && JSON.stringify(latest.rec) === JSON.stringify(job.rec) &&
          latest.newPhotos.length === job.newPhotos.length && latest.removed.length === job.removed.length){
        await jobDel(job.key);
      } else if (latest){
        latest.newPhotos.forEach(p => { if (job.newPhotos.some(q => q.name === p.name)) p.sent = true; });
        latest.removed = latest.removed.filter(n => !job.removed.includes(n));
        await jobPut(latest);
      }
      saved.photos = fin.count;
      if (st.list){
        const i = st.list.findIndex(r => r.id === saved.id);
        if (i >= 0) st.list[i] = saved; else st.list.push(saved);
      }
      if (st.photos[job.id]){
        for (const p of job.newPhotos) st.photos[job.id][p.name] = p.data;
        for (const n of job.removed) delete st.photos[job.id][n];
      }
    }
    DWQ.failed = "";
    for (const kind of Object.keys(KINDS)) if (!RS(kind).list) loadRecords(kind);
  }catch(e){
    DWQ.failed = errText(e, "No signal");
    connectionTrouble();
  }finally{
    DWQ.busy = false;
    await refreshJobs();
    if (!S.rec.jobs.length && !DWQ.failed && !pending) setStatus("All saved", true);
    else if (DWQ.failed && failStreak >= 2) setStatus("Not sent yet. It's safe on this device");
    if (KINDS[S.view] && RS(S.view).view !== "form") render();
  }
}

  }

    st.loadFailed = false;
    cacheSet("records:" + kind, st.list);
  }catch(e){
    st.loadFailed = !st.list;
    if (!quiet) connectionTrouble();
  }
  recLoading[kind] = false;
  if ((S.view === kind && st.view === "list") || S.view === "home") render();
  if (S.view === kind) loadThumbs(kind);
}
function mergedRecords(kind){
  const K = KINDS[kind], st = RS(kind);
  const byId = new Map((st.list || []).map(r => [r.id, {...r, pending: false}]));
  for (const j of kindJobs(kind)){
    if (j.del){ byId.delete(j.id); continue; }
    const base = byId.get(j.id) || {photos: 0};
    const unsent = j.newPhotos.filter(p => !p.sent).length;
    byId.set(j.id, {...base, ...j.rec, ...K.derive(j.rec), photos: (base.photos||0) + unsent - j.removed.length, pending: true});
  }
  return [...byId.values()].sort((a,b) => K.sortKey(b).localeCompare(K.sortKey(a)));
}

$("view").addEventListener("click", async ev => {
  const K = KINDS[S.view];
  if (!K) return;
  const st = RS(K.kind);
  const a = ev.target.closest("[data-act]");
  if (!a) return;
  const act = a.dataset.act;
  if (act === "retry"){ processQueue(); return; }
  if ((act === "new" || act === "edit") && !(await canEdit())) return;
  if (act === "new"){
    const draft = await kvGet("draft:" + K.kind) || (K.kind === "dayworks" ? await kvGet("dwDraft") : null);
    const rec = draft && draft.rec ? {...draft.rec} : {...K.blank(), id: newRecId(K)};
    if (!rec.id || !rec.id.startsWith(K.prefix)) rec.id = newRecId(K);
    await openRecForm(K, rec, true);
    if (draft && draft.rec){ st.form.added = draft.added || []; st.form.restored = true; render(); }
    return;
  }
  if (act === "open"){
    st.detail = a.dataset.id; st.view = "detail"; render(); window.scrollTo(0,0);
    await getRecPhotos(K.kind, st.detail); if (st.view === "detail") render();
    return;
  }
  if (act === "back"){
    if (st.view === "form" && st.form && !st.form.isNew){
      readRecForm(K);
      if (st.form.added.length || st.form.removed.length){
        if (!(await ask("Leave without saving your changes?", "Leave", true))) return;
      }
    }
    st.view = "list"; st.form = null; render(); return;
  }
  if (act === "edit"){
    const r = mergedRecords(K.kind).find(x => x.id === a.dataset.id);
    if (r) await openRecForm(K, r, false);
    return;
  }
  if (act === "rmphoto"){
    readRecForm(K);
    const f = st.form, name = a.dataset.name;
    if (!(await ask("Remove this photo?", "Remove photo", true))) return;
    const i = f.added.findIndex(p => p.name === name);
    if (i >= 0) f.added.splice(i, 1); else if (!f.removed.includes(name)) f.removed.push(name);
    saveRecDraft(K); render(); return;
  }
  if (act === "delete"){
    const f = st.form;
    if (!(await ask(`Delete this ${K.one}? Its photos will be deleted too. This can't be undone.`, "Delete", true))) return;
    await queueRecordDelete(K.kind, f.rec.id);
    st.view = "list"; st.form = null; render(); return;
  }
});

$("view").addEventListener("submit", async ev => {

  const rec = {...f.rec, chippies: +f.rec.chippies||0, fixers: +f.rec.fixers||0, operatives: +f.rec.operatives||0};

  $("recSave").disabled = true; $("recMsg").textContent = "Saving on this device…";
  try{

    if (f.isNew){ await kvSet("draft:" + K.kind, null); if (K.kind === "dayworks") await kvSet("dwDraft", null); }
    st.photos[rec.id] = st.photos[rec.id] || {};
    st.detail = rec.id; st.view = "detail"; st.form = null;
    render(); window.scrollTo(0,0);

    $("recMsg").textContent = "Couldn't store it on this device (storage may be full). Don't close the app. " + errText(e, "");
    $("recSave").disabled = false;
  }
});

  const f = S.talks.form;
  if (!file || !f) return;
  if (file.size > 15 * 1024 * 1024){ f.readMsg = "That PDF is bigger than 15 MB."; render(); return; }
  f.reading = true; render();
  try{
    const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
    const got = await server("uploadTalkPdf", f.rec.id, data, file.name);

    f.readMsg = (got.title || got.points.length)
      ? "PDF saved and read. Check the details below and change anything that's off."
      : "PDF saved. It couldn't be read automatically, so type the details in.";

setInterval(async () => {

      const ws = iso(A.week);
      const t = await bgServer("getWeek", ws);
      if (A.loaded === ws && !pending){ A.ticks = t || {}; cacheSet("week:" + ws, A.ticks); }
    }
    if (S.view !== "tools" && !KINDS[S.view] && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) render();
  }catch(e){}
}, 30000);

function startApp(b, fromCache){
  applyBrand(b.brand);
  setLadData(b.lads);
  S.booted = true;
  hideSplash();
  render();
  if (fromCache) warmFromCache(); else loadHome();
}
async function warmFromCache(){
  const [tools, dw, wd] = await Promise.all([cacheGet("tools"), cacheGet("records:dayworks"), cacheGet("records:works")]);
  if (tools && !S.tools) S.tools = tools;
  const log = await cacheGet("log");
  if (log && !S.log) S.log = log;
  if (dw && !RS("dayworks").list) RS("dayworks").list = dw;
  if (wd && !RS("works").list) RS("works").list = wd;
  const dayIdx = (new Date().getDay()+6)%7;
  if (dayIdx <= 5 && S.todayCount == null){
    const wk = await cacheGet("week:" + iso(mondayOf(new Date())));
    if (wk) S.todayCount = S.lads.filter(l => wk[l.id] && wk[l.id][DAYS[dayIdx]]).length;
  }
  if (!(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) render();
}

function loadJsPdf(){
  if (window.jspdf) return Promise.resolve(window.jspdf.jsPDF);
  return new Promise((ok, bad) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload = () => ok(window.jspdf.jsPDF); s.onerror = () => bad(new Error("Couldn't load the PDF maker. Check your signal."));
    document.head.appendChild(s);
  });
}
function navyLogo(){
  return new Promise(ok => {
    const im = new Image();
    im.onload = () => {
      try{
        const c = document.createElement("canvas"); c.width = im.naturalWidth; c.height = im.naturalHeight;
        const x = c.getContext("2d"); x.drawImage(im, 0, 0);
        const d = x.getImageData(0, 0, c.width, c.height), a = d.data;
        for (let i = 0; i < a.length; i += 4){
          const dark = 255 - (a[i] + a[i+1] + a[i+2]) / 3; // black logo on clear/white
          a[i+3] = Math.min(a[i+3], dark < 8 ? 0 : 255 * dark / 255); a[i] = 1; a[i+1] = 32; a[i+2] = 96;
        }
        x.putImageData(d, 0, 0); ok({url: c.toDataURL("image/png"), r: c.height / c.width});
      }catch(e){ ok(null); }
    };
    im.onerror = () => ok(null); im.src = DEFAULT_LOGO;
  });
}

function zoomPlan(f, cx, cy){
  const v = S.pourView;
  cx = cx == null ? v.x + v.w/2 : cx; cy = cy == null ? v.y + v.h/2 : cy;
  const w = Math.min(Math.max(v.w / f, 4000), (PB.x1 - PB.x0) * 1.5), h = v.h * w / v.w;
  S.pourView = {x: cx - (cx - v.x) * w / v.w, y: cy - (cy - v.y) * h / v.h, w, h};
}
// drag to move, pinch or wheel to zoom, tap to pick the nearest wall or column
(function(){
  const pts = new Map(); let start = null, moved = false, pinch0 = 0;
  const svgPt = (svg, x, y) => { const m = svg.getScreenCTM().inverse(); const p = new DOMPoint(x, y).matrixTransform(m); return {x: p.x, y: p.y}; };
  const setVB = svg => svg.setAttribute("viewBox", `${S.pourView.x} ${S.pourView.y} ${S.pourView.w} ${S.pourView.h}`);
  let redraw = null;
  const later = () => { clearTimeout(redraw); redraw = setTimeout(() => { if (S.view === "pours"){ const sc = window.scrollY; render(); window.scrollTo(0, sc); } }, 180); };
  document.addEventListener("pointerdown", ev => {
    const svg = ev.target.closest && ev.target.closest("#planSvg"); if (!svg) return;
    svg.setPointerCapture(ev.pointerId);
    pts.set(ev.pointerId, {x: ev.clientX, y: ev.clientY});
    if (pts.size === 1){ start = {x: ev.clientX, y: ev.clientY, v: {...S.pourView}}; moved = false; }
    if (pts.size === 2){ const [a, b] = [...pts.values()]; pinch0 = Math.hypot(a.x-b.x, a.y-b.y); start = {v: {...S.pourView}}; moved = true; }
  });
  document.addEventListener("pointermove", ev => {
    const svg = document.getElementById("planSvg"); if (!svg || !pts.has(ev.pointerId)) return;
    pts.set(ev.pointerId, {x: ev.clientX, y: ev.clientY});
    const r = svg.getBoundingClientRect(), scale = Math.max(start.v.w / r.width, start.v.h / r.height);
    if (pts.size === 1 && start.x != null){
      const dx = ev.clientX - start.x, dy = ev.clientY - start.y;
      if (Math.hypot(dx, dy) > 6) moved = true;
      if (moved){ S.pourView = {...start.v, x: start.v.x - dx*scale, y: start.v.y - dy*scale}; setVB(svg); later(); }
    } else if (pts.size === 2){
      const [a, b] = [...pts.values()], d = Math.hypot(a.x-b.x, a.y-b.y);
      S.pourView = {...start.v}; const c = svgPt(svg, (a.x+b.x)/2, (a.y+b.y)/2);
      zoomPlan(d / pinch0, c.x, c.y); setVB(svg); later();
    }
  });
  const up = ev => {
    const svg = document.getElementById("planSvg");
    if (!pts.has(ev.pointerId)) return;
    pts.delete(ev.pointerId);
    if (pts.size === 1){ const [p] = [...pts.values()]; start = {x: p.x, y: p.y, v: {...S.pourView}}; return; }
    if (pts.size || moved || !svg || ev.type === "pointercancel") return;
    const p = svgPt(svg, ev.clientX, ev.clientY), r = svg.getBoundingClientRect();
    const tol = 22 * Math.max(S.pourView.w / r.width, S.pourView.h / r.height);
    let best = null, bd = tol;
    const lf = Math.max(250, Math.min(1400, S.pourView.w / 45));
    for (const L of (PLAN.labels || [])){
      const cx = L.x + L.dx * lf * 1.5, cy = -L.y - L.dy * lf * 1.5, d = Math.hypot(p.x - cx, p.y - cy) - lf;
      if (d < bd){ bd = d; best = L.i; }
    }
    for (const e of PLAN.els){
      const dx = Math.max(e.x - p.x, 0, p.x - (e.x + e.w)), dy = Math.max(-(e.y + e.d) - p.y, 0, p.y + e.y);
      const d = Math.hypot(dx, dy); if (d < bd){ bd = d; best = e.i; }
    }
    pourSelect(best);
  };
  document.addEventListener("pointerup", up); document.addEventListener("pointercancel", up);
  document.addEventListener("wheel", ev => {
    const svg = ev.target.closest && ev.target.closest("#planSvg"); if (!svg) return;
    ev.preventDefault(); const c = svgPt(svg, ev.clientX, ev.clientY);
    zoomPlan(ev.deltaY < 0 ? 1.25 : 0.8, c.x, c.y); setVB(svg); later();
  }, {passive: false});
})();

    askWho();
    refreshJobs().then(() => { if (S.rec.jobs.length) processQueue(); });
    bgServer("importNewTools").then(n => {
      if (n > 0){ setStatus(n + " new tool" + (n === 1 ? "" : "s") + " added", true); loadTools(true); }
    }).catch(() => {});
    // put the (fixed) logo on the timesheet once; safe to repeat
    kvGet("timesheetLogoV2").then(done => {
      if (b.needsTimesheetBrand || !done) bgServer("applyBrandToTimesheet", S.brand.logo || DEFAULT_LOGO)
        .then(() => kvSet("timesheetLogoV2", true)).catch(() => {});
    });
    // faces: load them from Drive; if they're not there yet, copy the starting set in, then load again
    bgServer("getPhotosSmall").catch(() => bgServer("getPhotos"))
      .then(p => (p && Object.keys(p).length >= 5) ? p : bgServer("importLadPhotos").then(() => bgServer("getPhotosSmall").catch(() => bgServer("getPhotos"))))
      .then(p => { S.ladPhotos = p || {}; S.photosLoaded = true; cacheSet("ladPhotos", S.ladPhotos); render(); })
      .catch(e => { S.photosLoaded = true; render(); });
  }catch(e){
    hideSplash();
    if (!S.booted){ S.booted = false; }
    setStatus(e && e.code === "PIN" ? "Enter the PIN" : (S.booted ? "Offline. Showing the last saved copy" : "Couldn't load. Check your signal and reload"));
    if (!S.booted) $("view").innerHTML = e && e.code === "PIN" ? "" : `<div class="loading" style="flex-direction:column"><span>Couldn't reach Google.</span><button class="btn" onclick="location.reload()">Try again</button></div>`;
  }
})();
</script>
</body>
</html>
