// ================= Variation (VO) sheets =================
// Optional cover sheet in the layout Mark Deevy uses for variations: header, key references,
// description (instructed / carried out / not in our price / how it is valued), indirect costs
// reserved, then a labour summary. The EAS sheet and photos follow as the backing records.
// Rates are left blank on purpose so the QS fills them in (and no rates sit in the website code).
const VO_SUB = "New Bridge Form";
const VO_MAIN = "JJ Rhatigan";
const VO_RESERVE = `Where this Variation has the effect of causing disruption and / or prolongation to ${VO_SUB}'s Sub-Contract Works activities and / or prolongation to the Completion Date of ${VO_SUB}'s Sub-Contract Works, the required Extension of Time and related losses, loss and expense (and disruption) and Increased Costs are not included in the Direct Costs of this Variation as provided herein, but will be applied for separately by ${VO_SUB}, when it is feasible / practicable for them to do so.`;
function voDescription(r, num, nPhotos){
  const p = parseDet(r.description), d = p.det, out = [];
  const work = capFirst(p.work).replace(/\.?\s*$/, ".");
  const by = [d.by, d.co].filter(Boolean).join(", ");
  if (by || d.how) out.push(`${d.co || VO_MAIN} instructed ${VO_SUB} to carry out the following works${d.how ? " (" + d.how.toLowerCase() + ")" : ""}${d.by ? ", instruction given by " + by : ""}.${d.conf ? " Instruction confirmed by email: " + d.conf + "." : ""}`);
  out.push(work);
  const men = [[+r.chippies, "carpenter"], [+r.fixers, "steel fixer"], [+r.operatives, "general operative"]]
    .filter(([n]) => n > 0).map(([n, t]) => `${n} ${t}${n === 1 ? "" : "s"}`).join(", ");
  out.push(`${VO_SUB} carried out the works on ${easDate(r.date)}${r.start && r.end ? ", " + r.start + " to " + r.end : ""}${men ? ", with " + men : ""}${capFirst(r.location) ? ", at " + capFirst(r.location) : ""}.`);
  out.push(`${d.why ? capFirst(d.why).replace(/\.?\s*$/, ". ") : ""}These works were not included in ${VO_SUB}'s Sub-Contract scope or price. Thus, the works carried out by ${VO_SUB} constitute a variation to the Sub-Contract Works.`);
  if (d.spec) out.push(`Reference: ${capFirst(d.spec).replace(/\.?\s*$/, ".")}`);
  if (d.qty) out.push(`Quantities: ${d.qty.replace(/\.?\s*$/, ".")}`);
  out.push(`${VO_SUB} have evaluated this variation on a daywork basis, as set out below. The Event Analysis Sheet (EAS ${num}) and ${nPhotos ? nPhotos + " photograph" + (nPhotos === 1 ? "" : "s") : "photographs"} are attached.`);
  return out.filter(Boolean);
}
function voPage(doc, r, num, logo, nPhotos){
  const NAVY = "#012060", PALE = "#DCE6F2", HEAD = "#F2F5FA", M = 15, W = 180;
  const font = (st, sz, col) => { doc.setFont("helvetica", st); doc.setFontSize(sz); doc.setTextColor(col || "#000000"); };
  doc.setDrawColor(NAVY); doc.setLineWidth(0.25);
  const cell = (x, y, w, h, fill) => { if (fill){ doc.setFillColor(fill); doc.rect(x, y, w, h, "FD"); } else doc.rect(x, y, w, h); };
  const put = (s, x, y, h, o) => doc.text(String(s), x, y + h / 2, {baseline: "middle", ...(o || {})});
  const d = parseDet(r.description).det;
  let y = 12;
  if (logo){ const lw = 50, lh = lw * logo.r; doc.addImage(logo.url, "PNG", M, y, lw, lh, "nbflogo", "FAST"); y += lh + 3; }
  else { font("bold", 16, NAVY); doc.text("NEW BRIDGE FORM", M, y + 6); y += 10; }
  // title bar
  doc.setLineWidth(0.35); cell(M, y, W, 9, NAVY); doc.setLineWidth(0.25);
  font("bold", 11, "#FFFFFF"); put(`Variation ${num}${d.ref ? " (" + d.ref + ")" : ""} - ${capFirst(r.location) || "Site"}`, M + 2, y, 9);
  y += 11;
  // header
  const hdr = [["Contract:", EAS_SITE], ["Main Contractor:", VO_MAIN], ["Sub-Contract:", "Formwork, Steel Fixing & Concrete Placing"],
    ["Sub-Contractor:", VO_SUB], ["Date:", easDate(r.date)], ["Status:", `Variation Nr ${String(num).padStart(3, "0")}`]];
  hdr.forEach(([k, v]) => { cell(M, y, 40, 6, PALE); cell(M + 40, y, W - 40, 6); font("bold", 8.5, NAVY); put(k, M + 2, y, 6); font("normal", 9); put(v, M + 42, y, 6); y += 6; });
  y += 3;
  // key references
  cell(M, y, W, 7, PALE); font("bold", 10, NAVY); put("Key References / Information", M + 2, y, 7); y += 7;
  const instr = [d.how, [d.by, d.co].filter(Boolean).join(", "), d.conf ? "email " + d.conf : ""].filter(Boolean).join("; ");
  const refs = [["Instruction:", instr || "-"], ["Drawings / RFI:", d.drg || "-"], ["Spec / contract:", d.spec || "-"],
    ["Record Sheets:", `EAS ${num}, attached`], ["Pictures:", nPhotos ? `${nPhotos} photograph${nPhotos === 1 ? "" : "s"}, attached` : "-"],
    ["Signed off by JJR:", d.sign || "-"], ["Notice sent:", d.notice || "-"]];
  refs.forEach(([k, v]) => { cell(M, y, 40, 6); cell(M + 40, y, W - 40, 6); font("bold", 8.5, NAVY); put(k, M + 2, y, 6); font("normal", 9); put(doc.splitTextToSize(v, W - 44)[0] || "", M + 42, y, 6); y += 6; });
  y += 3;
  // description
  const block = (title, paras, bold) => {
    cell(M, y, W, 7, PALE); font("bold", 10, NAVY); put(title, M + 2, y, 7); y += 7;
    font(bold ? "bold" : "normal", 9.2); const lines = paras.flatMap((p, i) => (i ? [""] : []).concat(doc.splitTextToSize(p, W - 4)));
    const lh = 4.1, h = 3 + lines.length * lh + 2;
    cell(M, y, W, h); let ty = y + 4.5; lines.forEach(l => { doc.text(l, M + 2, ty); ty += lh; }); y += h + 3;
  };
  block("Description of Variation", voDescription(r, num, nPhotos));
  block("Indirect and Consequential Costs", [VO_RESERVE]);
  // labour summary, rates left blank for the QS
  cell(M, y, W, 7, PALE); font("bold", 10, NAVY); put("Summary of Direct Costs of Variation (daywork basis)", M + 2, y, 7); y += 7;
  const ws = [70, 30, 25, 25, 30], heads = ["Item", "Man-hours", "Unit", "Rate (€)", "Total (€)"];
  let x = M; heads.forEach((h, i) => { cell(x, y, ws[i], 6, HEAD); font("bold", 8.5, NAVY); put(h, x + 1.5, y, 6); x += ws[i]; }); y += 6;
  const hrs = dwHours(r);
  const rows = [[+r.chippies, "Labour: Carpenter"], [+r.fixers, "Labour: Steel Fixer"], [+r.operatives, "Labour: General Operative"]]
    .filter(([n]) => n > 0).map(([n, t]) => [t, String(Math.round(n * hrs * 100) / 100), "hr", "", ""]);
  if (d.mats) rows.push([`Materials: ${d.mats}`, "", "item", "", ""]);
  if (d.plant) rows.push([`Plant: ${d.plant}`, "", "item", "", ""]);
  if (!rows.length) rows.push(["Labour", String(hrs || ""), "hr", "", ""]);
  rows.push(["Total for the Direct Cost of this Variation", "", "", "", ""]);
  rows.forEach((rw, j) => { x = M; rw.forEach((v, i) => { cell(x, y, ws[i], 6); font(j === rows.length - 1 ? "bold" : "normal", 8.8); put(doc.splitTextToSize(String(v), ws[i] - 3)[0] || "", x + 1.5, y, 6); x += ws[i]; }); y += 6; });
}

// saved on the phone first, then sent to Google; retried until it gets through
async function savePourLocal(id, rec, newPhoto, noFlush){
  const pend = (await kvGet("pourPending")) || {};
  const j = pend[id] || {rec: {}, photos: []};
  const keep = (j.rec && j.rec.photos) || [];
  j.rec = {...rec, photos: [...new Set([...(rec.photos || []), ...keep])], by: getWho()};
  if (newPhoto) j.photos.push(newPhoto);
  pend[id] = j;
  await kvSet("pourPending", pend);
  S.pours[id] = rec.status ? j.rec : undefined;
  cacheSet("pours", S.pours);
  if (!noFlush) flushPours();
}
let pourFlushing = false;
async function flushPours(){
  if (pourFlushing) return; pourFlushing = true;
  setStatus("Saving…");
  try{
    for (const id of Object.keys((await kvGet("pourPending")) || {})){
      for (;;){
        let pend = (await kvGet("pourPending")) || {}, j = pend[id];
        if (!j) break;
        if (j.photos.length){
          const data = j.photos[0];
          const fid = await bgServer("savePourPhoto", id, data);
          pend = (await kvGet("pourPending")) || {}; j = pend[id];
          j.photos.shift(); j.rec.photos = [...(j.rec.photos || []), fid];
          await kvSet("pourPending", pend);
          S.pourPhotos[id] = (S.pourPhotos[id] || []).map(p => p.data === data ? {id: fid, data, thumb: p.thumb} : p);
          if (S.pours[id]) S.pours[id] = j.rec;
          continue;
        }
        const snap = JSON.stringify(j.rec);
        await bgServer("savePour", id, j.rec);
        pend = (await kvGet("pourPending")) || {};
        if (pend[id] && !pend[id].photos.length && JSON.stringify(pend[id].rec) === snap) delete pend[id];
        await kvSet("pourPending", pend);
        break;
      }
    }
    cacheSet("pours", S.pours);
    setStatus("Saved", true);
    if (S.view === "pours" && $("pourPanel") && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) $("pourPanel").innerHTML = pourPanelHtml();
  }catch(e){
    pourFlushing = false;
    setStatus(isNetworkError(e) ? "Saved on this phone. It'll send when there's signal" : `Not sent yet: ${errText(e, "Google said no")}. Photos are kept on this phone and it will try again`);
    setTimeout(flushPours, 30000);
    return;
  }
  pourFlushing = false;
  if (Object.keys((await kvGet("pourPending")) || {}).length) flushPours();
}
// small copy of a photo for the grid, so the phone isn't holding several full size pictures on screen
function makeThumb(dataUrl){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => { const k = Math.min(1, 420 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", 0.7)); };
    img.onerror = () => res(""); img.src = dataUrl;
  });
}

function loadJsPdf(){
  if (window.jspdf) return Promise.resolve(window.jspdf.jsPDF);
  return new Promise((ok, bad) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload = () => ok(window.jspdf.jsPDF); s.onerror = () => bad(new Error("Couldn't load the PDF maker. Check your signal."));
    document.head.appendChild(s);
  });
}
function navyLogo(){
  return new Promise(ok => {
    const im = new Image();
    im.onload = () => {
      try{
        const c = document.createElement("canvas"); c.width = im.naturalWidth; c.height = im.naturalHeight;
        const x = c.getContext("2d"); x.drawImage(im, 0, 0);
        const d = x.getImageData(0, 0, c.width, c.height), a = d.data;
        for (let i = 0; i < a.length; i += 4){
          const dark = 255 - (a[i] + a[i+1] + a[i+2]) / 3; // black logo on clear/white
          a[i+3] = Math.min(a[i+3], dark < 8 ? 0 : 255 * dark / 255); a[i] = 1; a[i+1] = 32; a[i+2] = 96;
        }
        x.putImageData(d, 0, 0); ok({url: c.toDataURL("image/png"), r: c.height / c.width});
      }catch(e){ ok(null); }
    };
    im.onerror = () => ok(null); im.src = DEFAULT_LOGO;
  });
}

// A3 plan page: the wall layout coloured by pour state, with number tags, dates and concrete. Used by the plan PDF and the report
function drawPlanA3(doc, logo, P, today, title){
    const NAVY = [1, 32, 96], W = 297, H = 420, M = 12;
    // header
    if (logo) doc.addImage(logo.url, "PNG", M, M, 60, 60 * logo.r);

    doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(90);
    doc.text(`Patrician Secondary School, Newbridge. Ground floor Phase 01`, W - M, M + 13, {align: "right"});
    doc.text(`Printed ${today.toLocaleDateString("en-GB")}  |  Walls from OCSC SE-10211 / SE-10212 Rev 01`, W - M, M + 18, {align: "right"});
    const top = M + 24; doc.setDrawColor(...NAVY); doc.setLineWidth(0.6); doc.line(M, top, W - M, top);
    // fit the plan
    const all = [...PLAN.els, ...(PLAN.stubs || [])], xs = all.flatMap(e => [e.x, e.x + e.w]), ys = all.flatMap(e => [e.y, e.y + e.d]);
    const X0 = Math.min(...xs) - 3500, X1 = Math.max(...xs) + 2500, Y0 = Math.min(...ys) - 3000, Y1 = Math.max(...ys) + 2500;
    const boxT = top + 4, boxB = H - M - 30, boxW = W - 2 * M, boxH = boxB - boxT;
    const k = Math.min(boxW / (X1 - X0), boxH / (Y1 - Y0));
    const ox = M + (boxW - (X1 - X0) * k) / 2, oy = boxT + (boxH - (Y1 - Y0) * k) / 2;
    const px = x => ox + (x - X0) * k, py = y => oy + (Y1 - y) * k;
    // grid
    doc.setLineWidth(0.15); doc.setDrawColor(185, 192, 205); doc.setLineDashPattern([2, 1.2], 0);
    doc.setFontSize(7); doc.setTextColor(...NAVY);
    for (const [n, x] of Object.entries(PLAN.gx)){ doc.line(px(x), py(Y1 - 1200), px(x), py(Y0 + 1500)); }
    for (const [n, y] of Object.entries(PLAN.gy)){ doc.line(px(X0 + 1500), py(y), px(X1 - 500), py(y)); }
    doc.setLineDashPattern([], 0); doc.setDrawColor(...NAVY); doc.setLineWidth(0.25);
    for (const [n, x] of Object.entries(PLAN.gx)){ doc.circle(px(x), py(Y0 + 800), 2.4, "S"); doc.text(n, px(x), py(Y0 + 800) + 0.9, {align: "center"}); }
    for (const [n, y] of Object.entries(PLAN.gy)){ doc.circle(px(X0 + 800), py(y), 2.4, "S"); doc.text(n, px(X0 + 800), py(y) + 0.9, {align: "center"}); }
    // walls
    const FILL = {"": [138, 138, 138], today: [245, 158, 11], poured: NAVY};
    doc.setFillColor(200); for (const e of (PLAN.stubs || [])) doc.rect(px(e.x), py(e.y + e.d), Math.max(e.w * k, 0.3), Math.max(e.d * k, 0.3), "F");
    for (const e of PLAN.els){ doc.setFillColor(...FILL[pourState(P[e.i])]); doc.rect(px(e.x), py(e.y + e.d), Math.max(e.w * k, 0.3), Math.max(e.d * k, 0.3), "F"); }
    // number tags, with date and concrete under poured ones
    const th = 3.4, off = 3.2 / k; // tag height mm on paper; leader length in plan mm
    for (const L of (PLAN.labels || [])){
      const p = P[L.i], st = pourState(p), t = L.t || String(parseInt(L.i.slice(1), 10));
      const cx = px(L.x + L.dx * off), cy = py(L.y + L.dy * off);
      doc.setDrawColor(...NAVY); doc.setLineWidth(0.2); doc.line(px(L.x), py(L.y), cx, cy);
      doc.setFont("helvetica", "bold"); doc.setFontSize(7);
      const tw = doc.getTextWidth(t) + 2.6;
      if (st === "poured"){ doc.setFillColor(255); doc.roundedRect(cx - tw/2, cy - th/2, tw, th, th/2, th/2, "FD"); doc.setTextColor(...NAVY); }
      else { doc.setFillColor(...(st === "today" ? FILL.today : NAVY)); doc.roundedRect(cx - tw/2, cy - th/2, tw, th, th/2, th/2, "F"); doc.setTextColor(255); }
      doc.text(t, cx, cy + 0.95, {align: "center"});
      if (st){
        const v = pourVol(L.i, p);
        const line = `${dmy(p.date)}${v ? `  ${m3(v.v)} m3${v.est ? "*" : ""}` : ""}`;
        doc.setFont("helvetica", "normal"); doc.setFontSize(5.2);
        const lw = doc.getTextWidth(line) + 1.4, ly = cy + th/2 + 2.3;
        doc.setFillColor(255); doc.rect(cx - lw/2, ly - 1.8, lw, 2.4, "F");
        doc.setTextColor(...(st === "today" ? [180, 100, 0] : NAVY)); doc.text(line, cx, ly, {align: "center"});
      }
    }
    // key + totals
    const ids = PLAN_IDS, poured = ids.filter(id => pourState(P[id]) === "poured"), tdy = ids.filter(id => pourState(P[id]) === "today");
    let tot = 0, anyEst = false; ids.forEach(id => { if (pourState(P[id])){ const v = pourVol(id, P[id]); if (v){ tot += v.v; anyEst = anyEst || v.est; } } });
    const ky = H - M - 22; doc.setDrawColor(...NAVY); doc.setLineWidth(0.4); doc.line(M, ky - 4, W - M, ky - 4);
    const key = [["Poured", FILL.poured], ["Being poured today", FILL.today], ["Not poured", FILL[""]]];
    doc.setFont("helvetica", "normal"); doc.setFontSize(9); let kx = M;
    key.forEach(([l, c]) => { doc.setFillColor(...c); doc.rect(kx, ky - 2.6, 6, 3, "F"); doc.setTextColor(40); doc.text(l, kx + 8, ky); kx += 12 + doc.getTextWidth(l) + 6; });
    doc.setFont("helvetica", "bold"); doc.setTextColor(...NAVY); doc.setFontSize(11);
    doc.text(`${poured.length} of ${ids.length} poured${tdy.length ? `, ${tdy.length} today` : ""}`, W - M, ky, {align: "right"});

    doc.text("Plan is for recording pours only. Do not set out from it; use the OCSC drawings.", M, ky + 11);
    return {tot, anyEst, ids, poured, tdy};
}

function zoomPlan(f, cx, cy){
  const v = S.pourView;
  cx = cx == null ? v.x + v.w/2 : cx; cy = cy == null ? v.y + v.h/2 : cy;
  const w = Math.min(Math.max(v.w / f, 4000), (PB.x1 - PB.x0) * 1.1), h = v.h * w / v.w;
  S.pourView = {x: cx - (cx - v.x) * w / v.w, y: cy - (cy - v.y) * h / v.h, w, h};
  clampView();
}
// keep at least a third of the plan on screen, however far it's dragged or zoomed
function clampView(){
  const v = S.pourView, X0 = PB.x0, X1 = PB.x1, Y0 = -PB.y1, Y1 = -PB.y0;
  v.x = Math.min(Math.max(v.x, X0 - v.w * 0.66), X1 - v.w * 0.34);
  v.y = Math.min(Math.max(v.y, Y0 - v.h * 0.66), Y1 - v.h * 0.34);
}
// drag to move, pinch or wheel to zoom, tap to pick the nearest wall or column
(function(){
  const pts = new Map(); let start = null, moved = false, pinch0 = 0;
  const svgPt = (svg, x, y) => { const m = svg.getScreenCTM().inverse(); const p = new DOMPoint(x, y).matrixTransform(m); return {x: p.x, y: p.y}; };
  const setVB = svg => svg.setAttribute("viewBox", `${S.pourView.x} ${S.pourView.y} ${S.pourView.w} ${S.pourView.h}`);
  let redraw = null;
  const later = () => { clearTimeout(redraw); redraw = setTimeout(() => { if (pts.size) return later(); if (S.view === "pours") pourRefresh(); }, 180); };
  document.addEventListener("pointerdown", ev => {
    const svg = ev.target.closest && ev.target.closest("#planSvg"); if (!svg) return;
    svg.setPointerCapture(ev.pointerId);
    pts.set(ev.pointerId, {x: ev.clientX, y: ev.clientY});
    if (pts.size === 1){ start = {x: ev.clientX, y: ev.clientY, v: {...S.pourView}}; moved = false; }
    if (pts.size === 2){ const [a, b] = [...pts.values()]; pinch0 = Math.hypot(a.x-b.x, a.y-b.y); start = {v: {...S.pourView}}; moved = true; }
  });
  document.addEventListener("pointermove", ev => {
    const svg = document.getElementById("planSvg"); if (!svg || !pts.has(ev.pointerId)) return;
    pts.set(ev.pointerId, {x: ev.clientX, y: ev.clientY});
    const r = svg.getBoundingClientRect(), scale = Math.max(start.v.w / r.width, start.v.h / r.height);
    if (pts.size === 1 && start.x != null){
      const dx = ev.clientX - start.x, dy = ev.clientY - start.y;
      if (Math.hypot(dx, dy) > 6) moved = true;
      if (moved){ S.pourView = {...start.v, x: start.v.x - dx*scale, y: start.v.y - dy*scale}; clampView(); setVB(svg); later(); }
    } else if (pts.size === 2){
      const [a, b] = [...pts.values()], d = Math.hypot(a.x-b.x, a.y-b.y);
      S.pourView = {...start.v}; const c = svgPt(svg, (a.x+b.x)/2, (a.y+b.y)/2);
      zoomPlan(d / pinch0, c.x, c.y); setVB(svg); later();
    }
  });
  const up = ev => {
    const svg = document.getElementById("planSvg");
    if (!pts.has(ev.pointerId)) return;
    pts.delete(ev.pointerId);
    if (pts.size === 1){ const [p] = [...pts.values()]; start = {x: p.x, y: p.y, v: {...S.pourView}}; return; }
    if (pts.size || moved || !svg || ev.type === "pointercancel") return;
    const p = svgPt(svg, ev.clientX, ev.clientY), r = svg.getBoundingClientRect();
    const tol = 22 * Math.max(S.pourView.w / r.width, S.pourView.h / r.height);
    let best = null, bd = tol;
    const lf = Math.max(250, Math.min(1400, S.pourView.w / 45));
    for (const L of (PLAN.labels || [])){
      const cx = L.x + L.dx * lf * 1.5, cy = -L.y - L.dy * lf * 1.5, d = Math.hypot(p.x - cx, p.y - cy) - lf;
      if (d < bd){ bd = d; best = L.i; }
    }
    for (const e of PLAN.els){
      const dx = Math.max(e.x - p.x, 0, p.x - (e.x + e.w)), dy = Math.max(-(e.y + e.d) - p.y, 0, p.y + e.y);
      const d = Math.hypot(dx, dy); if (d < bd){ bd = d; best = e.i; }
    }
    pourSelect(best);
  };
  document.addEventListener("pointerup", up); document.addEventListener("pointercancel", up);
  document.addEventListener("wheel", ev => {
    const svg = ev.target.closest && ev.target.closest("#planSvg"); if (!svg) return;
    ev.preventDefault(); const c = svgPt(svg, ev.clientX, ev.clientY);
    zoomPlan(ev.deltaY < 0 ? 1.25 : 0.8, c.x, c.y); setVB(svg); later();
  }, {passive: false});
})();

function peSync(){

  r.querySelectorAll("[data-pe-tool]").forEach(b => b.setAttribute("aria-pressed", b.dataset.peTool === PE.tool));
  r.querySelectorAll("[data-pe-color]").forEach(b => b.setAttribute("aria-pressed", b.dataset.peColor === PE.color));
  r.querySelectorAll("[data-pe-size]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.peSize === PE.size));
  r.querySelector("#peColors").classList.toggle("off", PE.tool === "hl" || PE.tool === "erase");
  r.querySelector("[data-pe=undo]").disabled = !PE.undo.length;

async function peClick(ev){
  const t = ev.target.closest("[data-pe-tool]");
  if (t){ PE.tool = t.dataset.peTool; return peSync(); }
  const c = ev.target.closest("[data-pe-color]");
  if (c){ PE.color = c.dataset.peColor; if (PE.tool === "move" || PE.tool === "erase") PE.tool = "pen"; return peSync(); }
  const z = ev.target.closest("[data-pe-size]");
  if (z){ PE.size = +z.dataset.peSize; return peSync(); }
  const a = ev.target.closest("[data-pe]");
  if (!a) return;
  const act = a.dataset.pe;
  if (act === "open") return peOpen();
  if (act === "undo") return peUndo();
  if (act === "zin" || act === "zout") return peZoom(act === "zin" ? 1 : -1);
  if (act === "export") return peExport();
}

function pickFile(accept){
  return new Promise(resolve => {
    const i = document.createElement("input");
    i.type = "file"; i.accept = accept; i.style.display = "none";
    i.onchange = () => { resolve(i.files && i.files[0] || null); i.remove(); };
    document.body.appendChild(i); i.click();
  });
}
async function peOpen(){
  if (PE.pages.some(p => p.ann.length) && !confirm("Open a different file? Your markings on this one will be lost unless you've exported it.")) return;
  const f = await pickFile("application/pdf,.pdf,image/*");
  if (!f) return;
  PE.err = ""; PE.loading = "Opening " + f.name + "…"; PE.pages = []; PE.undo = []; PE.zoom = 1;
  if (S.pdfOut && S.pdfOut.key === "peExport") S.pdfOut = null;
  PE.root.querySelector("#pePages").innerHTML = ""; peSync();
  try{
    let bytes;
    if (/pdf$/i.test(f.type) || /\.pdf$/i.test(f.name)) bytes = new Uint8Array(await f.arrayBuffer());
    else bytes = await peImageToPdf(f);
    PE.bytes = bytes;
    PE.name = f.name.replace(/\.[^.]+$/, "");
    const lib = await loadPdfJs();
    const doc = await lib.getDocument({data: bytes.slice()}).promise;
    PE.doc = doc;
    for (let i = 1; i <= doc.numPages; i++){
      const pg = await doc.getPage(i);
      const vp = pg.getViewport({scale: 1});
      PE.pages.push(peMakePage(pg, vp, i - 1));
    }
    PE.loading = "";
    if (PE.tool === "move") PE.tool = "pen";
    peSync();
    await peRenderAll();
  }catch(e){
    PE.pages = []; PE.loading = "";
    PE.err = /password/i.test(String(e && e.message)) ? "That PDF is password protected, so it can't be opened here." : errText(e, "Couldn't open that file.");
    peSync();
  }
}
// a photo becomes a one page PDF the same size as the photo
async function peImageToPdf(file){
  const url = URL.createObjectURL(file);
  try{
    const im = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => bad(new Error("Couldn't read that photo.")); i.src = url; });
    const max = 3000, s = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
    const jpg = await new Promise(ok => c.toBlob(ok, "image/jpeg", 0.9));
    const L = await loadPdfLib();
    const pdf = await L.PDFDocument.create();
    const img = await pdf.embedJpg(new Uint8Array(await jpg.arrayBuffer()));
    const w = c.width * 0.75, h = c.height * 0.75;   // 96 dpi pixels to points
    pdf.addPage([w, h]).drawImage(img, {x: 0, y: 0, width: w, height: h});
    return await pdf.save();
  } finally { URL.revokeObjectURL(url); }
}

function peMakePage(pg, vp, index){
  const wrap = document.createElement("div");
  wrap.className = "pe-page";
  const base = document.createElement("canvas"), over = document.createElement("canvas");
  base.className = "pe-base"; over.className = "pe-over";
  wrap.append(base, over);
  PE.root.querySelector("#pePages").appendChild(wrap);
  const p = {pg, index, w: vp.width, h: vp.height, wrap, base, over, ann: [], k: 1, rendered: 0};
  peBindDrawing(p);
  return p;
}
function peCssWidth(p){
  const box = PE.root.querySelector("#pePages");
  const avail = Math.max(260, (box.clientWidth || window.innerWidth - 32));
  return Math.round(avail * PE.zoom);
}
async function peRenderAll(){
  const job = PE.renderJob = {};
  for (const p of PE.pages){
    if (PE.renderJob !== job) return;
    await peRenderPage(p);
  }
}
async function peRenderPage(p){
  const cssW = peCssWidth(p), cssH = Math.round(cssW * p.h / p.w);
  p.wrap.style.width = cssW + "px"; p.wrap.style.height = cssH + "px";
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let pxW = cssW * dpr, pxH = cssH * dpr;
  const cap = 12e6 / (pxW * pxH);          // keep each page under ~12 million pixels so tablets don't run out of memory
  if (cap < 1){ pxW *= Math.sqrt(cap); pxH *= Math.sqrt(cap); }
  pxW = Math.floor(pxW); pxH = Math.floor(pxH);
  if (p.rendered === pxW) { peDraw(p); return; }
  const scale = pxW / p.w;
  const tmp = document.createElement("canvas"); tmp.width = pxW; tmp.height = pxH;
  if (p.task) try{ p.task.cancel(); }catch(e){}
  p.task = p.pg.render({canvasContext: tmp.getContext("2d"), viewport: p.pg.getViewport({scale})});
  try{ await p.task.promise; }catch(e){ return; }
  p.base.width = pxW; p.base.height = pxH; p.base.getContext("2d").drawImage(tmp, 0, 0);
  tmp.width = tmp.height = 0;
  p.over.width = pxW; p.over.height = pxH;
  p.rendered = pxW; p.k = pxW / p.w;
  peDraw(p);
}
let peZoomTimer = 0;
function peZoom(dir){
  const steps = [0.5, 0.75, 1, 1.5, 2, 3, 4];
  let i = steps.findIndex(s => s >= PE.zoom - 0.001);
  i = Math.max(0, Math.min(steps.length - 1, i + dir));
  const box = PE.root.querySelector("#pePages"), old = PE.zoom;
  const cx = (box.scrollLeft + box.clientWidth / 2) / old, cy = (window.scrollY - box.offsetTop + window.innerHeight / 2) / old;
  PE.zoom = steps[i]; peSync();
  // resize straight away (blurry for a moment), redraw sharp once the zooming stops
  PE.pages.forEach(p => { const w = peCssWidth(p); p.wrap.style.width = w + "px"; p.wrap.style.height = Math.round(w * p.h / p.w) + "px"; });
  box.scrollLeft = cx * PE.zoom - box.clientWidth / 2;
  window.scrollTo(0, cy * PE.zoom + box.offsetTop - window.innerHeight / 2);
  clearTimeout(peZoomTimer); peZoomTimer = setTimeout(peRenderAll, 250);
}
window.addEventListener("resize", () => { if (S.view === "pdfedit" && PE.pages.length){ clearTimeout(peZoomTimer); peZoomTimer = setTimeout(peRenderAll, 300); } });

// ----- drawing -----
function peStrokePath(ctx, pts, k){
  ctx.beginPath();
  if (pts.length === 1){ ctx.moveTo(pts[0][0] * k, pts[0][1] * k); ctx.lineTo(pts[0][0] * k + 0.01, pts[0][1] * k); return; }
  ctx.moveTo(pts[0][0] * k, pts[0][1] * k);
  for (let i = 1; i < pts.length - 1; i++){
    const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
    ctx.quadraticCurveTo(pts[i][0] * k, pts[i][1] * k, mx * k, my * k);
  }
  const l = pts[pts.length - 1]; ctx.lineTo(l[0] * k, l[1] * k);
}
function peDrawObj(ctx, o, k){
  if (o.type === "text"){
    ctx.fillStyle = o.color; ctx.textBaseline = "alphabetic";
    ctx.font = `bold ${o.size * k}px Helvetica, Arial, sans-serif`;
    ctx.fillText(o.text, o.x * k, o.y * k);
    return;
  }
  ctx.save();
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.strokeStyle = o.color; ctx.lineWidth = o.width * k;
  if (o.type === "hl") ctx.globalAlpha = 0.4;
  peStrokePath(ctx, o.pts, k); ctx.stroke();
  ctx.restore();
}
function peDraw(p){
  const ctx = p.over.getContext("2d");
  ctx.clearRect(0, 0, p.over.width, p.over.height);
  p.ann.forEach(o => peDrawObj(ctx, o, p.k));
  if (p.live) peDrawObj(ctx, p.live, p.k);
}
function pePoint(p, ev){
  const r = p.over.getBoundingClientRect();
  return [(ev.clientX - r.left) / r.width * p.w, (ev.clientY - r.top) / r.height * p.h];
}
function peBindDrawing(p){
  const ov = p.over;
  let active = null;
  ov.addEventListener("pointerdown", async ev => {
    if (PE.tool === "move" || (ev.pointerType === "mouse" && ev.button !== 0)) return;
    ev.preventDefault();
    const pt = pePoint(p, ev), cssPerPt = p.wrap.clientWidth / p.w;
    if (PE.tool === "text"){
      const text = await askText("Add text", "Text", "", "Add");
      if (!text) return;
      const size = PE_SIZES.text[PE.size] / cssPerPt;
      peAdd(p, {type: "text", text, x: pt[0], y: pt[1] + size * 0.35, size, color: PE.color});
      return;
    }
    if (PE.tool === "erase"){
      const i = peHit(p, pt, 14 / cssPerPt);
      if (i >= 0){ const o = p.ann.splice(i, 1)[0]; PE.undo.push({p, o, i, del: true}); peDraw(p); peSync(); }
      active = {erase: true};
      ov.setPointerCapture(ev.pointerId);
      return;
    }
    const hl = PE.tool === "hl";
    p.live = {type: hl ? "hl" : "pen", color: hl ? PE_HL : PE.color, width: PE_SIZES[PE.tool][PE.size] / cssPerPt, pts: [pt]};
    active = {id: ev.pointerId};
    ov.setPointerCapture(ev.pointerId);
    peDraw(p);
  });
  ov.addEventListener("pointermove", ev => {
    if (!active) return;
    ev.preventDefault();
    const pt = pePoint(p, ev);
    if (active.erase){
      const i = peHit(p, pt, 14 / (p.wrap.clientWidth / p.w));
      if (i >= 0){ const o = p.ann.splice(i, 1)[0]; PE.undo.push({p, o, i, del: true}); peDraw(p); peSync(); }
      return;
    }
    const evs = ev.getCoalescedEvents ? ev.getCoalescedEvents() : [ev];
    (evs.length ? evs : [ev]).forEach(e => p.live.pts.push(pePoint(p, e)));
    peDraw(p);
  });
  const end = () => {
    if (!active) return;
    const wasErase = active.erase; active = null;
    if (wasErase || !p.live) return;
    const o = p.live; p.live = null;
    // highlighter: if it's nearly a straight line, make it perfectly straight
    if (o.type === "hl" && o.pts.length > 2){
      const a = o.pts[0], b = o.pts[o.pts.length - 1], len = Math.hypot(b[0] - a[0], b[1] - a[1]);
      const dev = Math.max(...o.pts.map(q => Math.abs((b[0] - a[0]) * (a[1] - q[1]) - (a[0] - q[0]) * (b[1] - a[1])) / (len || 1)));
      if (len > o.width * 2 && dev < o.width * 0.6) o.pts = [a, b];
    }
    o.pts = peSimplify(o.pts, 0.35 / p.k);
    peAdd(p, o);
  };
  ov.addEventListener("pointerup", end);
  ov.addEventListener("pointercancel", end);
}
function peAdd(p, o){ p.ann.push(o); PE.undo.push({p, o}); peDraw(p); peSync(); }
function peUndo(){
  const u = PE.undo.pop(); if (!u) return;
  if (u.del) u.p.ann.splice(u.i, 0, u.o);
  else { const i = u.p.ann.lastIndexOf(u.o); if (i >= 0) u.p.ann.splice(i, 1); }
  peDraw(u.p); peSync();
}
function peHit(p, pt, tol){
  for (let i = p.ann.length - 1; i >= 0; i--){
    const o = p.ann[i];
    if (o.type === "text"){
      const ctx = p.over.getContext("2d"); ctx.font = `bold ${o.size}px Helvetica, Arial, sans-serif`;
      const w = ctx.measureText(o.text).width;
      if (pt[0] > o.x - tol && pt[0] < o.x + w + tol && pt[1] > o.y - o.size - tol && pt[1] < o.y + o.size * 0.3 + tol) return i;
      continue;
    }
    const r = tol + o.width / 2;
    for (let j = 0; j < o.pts.length; j++){
      const a = o.pts[j], b = o.pts[j + 1] || a;
      if (peSegDist(pt, a, b) < r) return i;
    }
  }
  return -1;
}
function peSegDist(p, a, b){
  const dx = b[0] - a[0], dy = b[1] - a[1], l = dx * dx + dy * dy;
  const t = l ? Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / l)) : 0;
  return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dy);
}
function peSimplify(pts, tol){
  if (pts.length < 3) return pts;
  const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++){
    const l = out[out.length - 1];
    if (Math.hypot(pts[i][0] - l[0], pts[i][1] - l[1]) >= tol) out.push(pts[i]);
  }
  out.push(pts[pts.length - 1]);
  return out;
}

// ----- export: write the markings into the original PDF as real lines and text -----
async function peExport(){
  if (!PE.bytes) return;
  await runPdf("peExport", async () => {
    const L = await loadPdfLib();
    const doc = await L.PDFDocument.load(PE.bytes, {ignoreEncryption: true});
    const font = await doc.embedFont(L.StandardFonts.HelveticaBold);
    const pages = doc.getPages();
    PE.pages.forEach((pp, i) => {
      if (!pp.ann.length) return;
      const page = pages[i];
      const box = page.getCropBox(), W = box.width, H = box.height;
      const rot = ((page.getRotation().angle % 360) + 360) % 360;
      // screen point (x across, y down, as the page is shown) -> PDF page point
      const map = (x, y) => {
        let u, v;
        if (rot === 90){ u = y; v = x; }
        else if (rot === 180){ u = W - x; v = y; }
        else if (rot === 270){ u = W - y; v = H - x; }
        else { u = x; v = H - y; }
        return [box.x + u, box.y + v];
      };
      const hl = pp.ann.filter(o => o.type === "hl"), rest = pp.ann.filter(o => o.type !== "hl");
      [...hl, ...rest].forEach(o => {
        const col = peRgb(L, o.color);
        if (o.type === "text"){
          const [x, y] = map(o.x, o.y);
          page.drawText(peSafeText(font, o.text), {x, y, size: o.size, font, color: col, rotate: L.degrees(rot)});
          return;
        }
        const pts = o.pts.length === 1 ? [o.pts[0], [o.pts[0][0] + 0.01, o.pts[0][1]]] : o.pts;
        // drawSvgPath flips y around the origin we give it, so feed it page coordinates with y pointing down from the top
        const d = pts.map((q, j) => { const [x, y] = map(q[0], q[1]); return `${j ? "L" : "M"}${(x - box.x).toFixed(2)} ${(H - (y - box.y)).toFixed(2)}`; }).join(" ");
        page.drawSvgPath(d, {x: box.x, y: box.y + H, borderColor: col, borderWidth: o.width, borderLineCap: L.LineCapStyle.Round,
          borderOpacity: o.type === "hl" ? 0.45 : 1, blendMode: o.type === "hl" ? L.BlendMode.Multiply : undefined});
      });
    });
    const out = await doc.save();
    const name = (PE.name || "Drawing") + " - marked up.pdf";
    const blob = new Blob([out], {type: "application/pdf"});
    const file = new File([blob], name, {type: "application/pdf"});
    return {name, blobUrl: URL.createObjectURL(blob), file, note: "Saved on this device. Download it or share it straight from here."};
  });
}
function peRgb(L, hex){
  const n = parseInt(hex.slice(1), 16);
  return L.rgb(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255);
}
function peSafeText(font, s){
  let out = "";
  for (const ch of s){ try{ font.encodeText(ch); out += ch; }catch(e){ out += "?"; } }
  return out;
}
