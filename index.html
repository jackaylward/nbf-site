<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>New Bridge Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#012060">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" sizes="32x32" href="icon-32.png">
<link rel="icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="config.js"></script>
<style>
:root{
  color-scheme: light;
  --brand:#012060; --ink:#111827; --muted:#6a7180; --bg:#f4f6fa; --card:#ffffff;
  --line:#e1e6ef; --soft:#f2f5fa; --ok:#1b7a44; --warn:#b3261e; --amber:#b86a12; --yellow:#ffe600;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  --rail:0px; --top:60px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{font-family:"Barlow Condensed",sans-serif;margin:0;letter-spacing:.02em}
a{color:inherit}

/* the page itself never slides sideways or pinch-zooms; only the drawing moves */
html,body{overflow-x:clip;overscroll-behavior-x:none;touch-action:pan-x pan-y}
/* ---------- frame: phone first ---------- */
header.top{position:sticky;top:0;z-index:5;height:var(--top);background:var(--brand);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px}
.logo{height:30px;width:auto;max-width:160px;object-fit:contain;display:block}
.logo.chip{background:#fff;border-radius:6px;padding:3px 6px}
.viewtitle{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.15rem;text-transform:uppercase;letter-spacing:.08em;opacity:.75;white-space:nowrap}
.status{margin-left:auto;font-size:.78rem;color:rgba(255,255,255,.7);text-align:right;max-width:45%}
.status.ok{color:#9be3b6}
.brandname{display:none}
main{padding:18px 16px 110px;max-width:1240px;margin:0 auto}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--brand);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .navlogo{display:none}
nav.tabs .lg{display:none}
nav.tabs button{flex:1;max-width:120px;border:0;background:none;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(255,255,255,.55);font-size:.68rem;font-weight:600;letter-spacing:.02em;cursor:pointer;border-radius:10px;position:relative}
nav.tabs svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:#fff;background:rgba(255,255,255,.1)}
nav.tabs button[data-badge]:not([data-badge=""])::after{content:attr(data-badge);position:absolute;top:2px;right:calc(50% - 22px);background:#f59e0b;color:#111;border-radius:999px;font-size:.66rem;font-weight:700;padding:0 5px;line-height:1.5}

@media (min-width:760px){ header.top{padding:0 24px} main{padding:24px 24px 50px} }
@media (min-width:1100px){ .viewtitle{font-size:1.4rem} main{padding:28px 36px 60px} }

/* ---------- building blocks ---------- */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--brand);background:var(--brand);color:#fff;font-weight:600;font-size:.98rem;padding:10px 16px;border-radius:10px;cursor:pointer;transition:transform .08s,background .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{box-shadow:0 4px 12px rgba(0,0,0,.15)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:var(--card);color:var(--warn);border-color:#efc4c0}
.btn:disabled{opacity:.5}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.76rem;font-weight:700;letter-spacing:.02em;background:var(--soft);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.warn{background:#fdecea;color:var(--warn);border-color:#f5c6c2}
.pill.amber{background:#fff3e0;color:var(--amber);border-color:#f3d5ae}
.pill.ok{background:#e7f5ec;color:var(--ok);border-color:#c3e5d0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.panel h2{font-size:1.35rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.msg{margin:8px 0 0;font-size:.9rem;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.field input,.field select,.field textarea{font-size:1rem;color:var(--ink);padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-weight:400;text-transform:none;letter-spacing:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);outline:none}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;min-width:46px;height:40px;border-radius:9px;cursor:pointer;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.02rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:0 10px}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.seg button.arrow{font-size:1.3rem}
.seg span{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.1rem;padding:0 8px;align-self:center;letter-spacing:.03em}
.count{display:flex;align-items:baseline;gap:10px;margin:0 2px 14px}
.count b{font-family:"Barlow Condensed",sans-serif;font-size:3rem;line-height:1}
.greet{margin:0;font-size:1rem}

/* home */
.hero{background:var(--brand);color:#fff;border-radius:18px;padding:22px 22px 18px;margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border:28px solid rgba(255,255,255,.05);border-radius:50%;pointer-events:none}
.hero .top-row{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.hero h1{font-size:2rem;text-transform:uppercase;letter-spacing:.05em;line-height:1}
.hero .greet{color:rgba(255,255,255,.65);margin-top:4px}
.hero .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.hero .btn.ghost:hover{border-color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px;position:relative;z-index:1}
.stat{border-top:1px solid rgba(255,255,255,.18);padding-top:10px;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;color:#fff;text-align:left}
.stat b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:2.6rem;line-height:1}
.stat span{font-size:.8rem;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.06em}
.stat .ot{margin:0;font-size:.8rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;background:var(--card);text-align:left;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.card h3{font-size:.95rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.card .big{font-family:"Barlow Condensed",sans-serif;font-size:2.8rem;font-weight:700;line-height:1.1}
.card p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
@media (max-width:520px){ .stat b{font-size:2rem} .hero h1{font-size:1.6rem} }

/* groups of lads */
.group{margin-bottom:16px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.group h2{flex-wrap:wrap;padding:12px 16px;font-size:1.15rem;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);position:relative}
.group h2::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c);display:inline-block;margin-right:10px;align-self:center;flex:0 0 auto}
.group h2 .gname{margin-right:auto;color:var(--ink)}
.group h2 span{color:var(--muted);font-weight:600;white-space:nowrap}
.lads{display:grid;grid-template-columns:1fr}
.lad{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.av{flex:0 0 52px;height:52px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--ink);font-size:1.05rem;border:2px solid var(--c);overflow:hidden;cursor:pointer;padding:0}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.who{flex:1;min-width:0}
.who strong{display:block;font-weight:600;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who em{font-style:normal;color:var(--muted);font-size:.86rem}
.tick{flex:0 0 auto;width:52px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;transition:background .12s,border-color .12s}
.tick:hover{border-color:var(--ink)}
.tick svg{width:28px;height:28px;opacity:0;stroke:#fff}
.tick[aria-pressed="true"]{background:var(--brand);border-color:var(--brand)}
.tick[aria-pressed="true"] svg{opacity:1}
.weekrow{display:flex;gap:4px}
.weekrow .tick{width:40px;height:40px;border-radius:9px}
.weekrow .tick svg{width:20px;height:20px}
.dayhead{display:flex;gap:4px;padding:6px 14px;justify-content:flex-end;border-bottom:1px solid var(--line);color:var(--muted);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.dayhead span{width:40px;text-align:center}
.rm{flex:0 0 auto}
@media (min-width:760px){
  .lads.day{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .lads.day .lad{border-right:1px solid var(--line)}
}
@media (max-width:560px){
  .weekrow .tick{width:32px;height:32px}.dayhead span{width:32px}
  .weekrow .tick svg{width:17px;height:17px}
  .av{flex-basis:44px;height:44px}
}

/* timesheet */
.ts-lad{padding:12px 14px;border-bottom:1px solid var(--line)}
.ts-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ts-top .tot{margin-left:auto;text-align:right;font-weight:600;white-space:nowrap}
.ts-top .tot b{font-family:"Barlow Condensed",sans-serif;font-size:1.5rem}
.ot{display:inline-block;margin-left:6px;background:var(--yellow);color:#111;border-radius:6px;padding:0 6px;font-size:.85rem;font-weight:700}
.hours{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.hours label{display:flex;flex-direction:column;align-items:center;font-size:.68rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;gap:3px}
.hours input{color:var(--ink);width:100%;min-width:0;text-align:center;font-size:1.05rem;padding:10px 2px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.hours input:focus{border-color:var(--ink);outline:none}
.hours input.over{background:var(--yellow);border-color:#e0c900;font-weight:700}
.hours input.bad{border-color:var(--warn)}
.notes{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:.9rem;color:var(--ink);background:var(--card)}
.ts-total{flex-wrap:wrap;gap:6px 12px;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--brand);color:#fff;border-radius:var(--radius);font-weight:600;margin:0 0 16px;text-transform:uppercase;letter-spacing:.05em}
.ts-total b{font-family:"Barlow Condensed",sans-serif;font-size:2rem;letter-spacing:0}
@media (min-width:1100px){
  .ts-lad{display:grid;grid-template-columns:minmax(340px,1.3fr) minmax(360px,1.6fr) minmax(150px,.8fr);gap:16px;align-items:center}
  .ts-top{margin:0}
  .notes{margin:0}
}

.grow{flex:1 1 0}
.tsbar .controls{row-gap:12px}
.tsbar .btn{height:44px}
.controls .btn{height:44px}

/* tools and records lists */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input,.toolbar select{padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:1rem;background:var(--card)}
.toolbar input{flex:1;min-width:180px}
.list{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:1000px){ .list{grid-template-columns:repeat(2,1fr)} }
@media (min-width:1500px){ .list{grid-template-columns:repeat(3,1fr)} }
.menubtn{display:flex;width:42px;height:42px;margin-left:-8px;border:0;border-radius:10px;background:none;color:#fff;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.menubtn,.menubtn *,nav.tabs,nav.tabs *,header.top,.scrim,button{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.menubtn:focus,.menubtn:focus-visible{outline:none}
.menubtn svg{pointer-events:none;width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.menubtn:active{background:rgba(255,255,255,.14)}
.menubtn{display:flex}
header.top{gap:10px}
.logo{max-width:118px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:19;opacity:0;pointer-events:none;transition:opacity .2s;display:block}
.scrim.open{opacity:1;pointer-events:auto}
nav.tabs{top:0;bottom:0;right:auto;left:0;width:min(78vw,300px);flex-direction:column;justify-content:flex-start;gap:2px;padding:20px 12px calc(20px + env(safe-area-inset-bottom));transform:translateX(-105%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s;z-index:20;overflow-y:auto;box-shadow:6px 0 24px rgba(0,0,0,.25)}
nav.tabs.open{transform:none;visibility:visible;transition:transform .22s ease}
nav.tabs .navlogo{display:block;padding:4px 10px 22px}
nav.tabs .navlogo img{width:100%;height:auto;max-width:180px}
nav.tabs .lg{display:inline}
nav.tabs button{flex:0 0 auto;max-width:none;flex-direction:row;justify-content:flex-start;gap:14px;padding:13px 14px;font-size:1rem;letter-spacing:.01em;border-radius:10px;color:rgba(255,255,255,.85)}
nav.tabs button[aria-current="page"]{background:#fff;color:var(--brand)}
nav.tabs button[data-badge]:not([data-badge=""])::after{position:static;margin-left:auto}
nav.tabs .navcredit{display:block;margin-top:auto;padding:14px 10px 0;font-size:.66rem;letter-spacing:.04em;color:rgba(255,255,255,.35);line-height:1.4}
main{padding-bottom:40px}
.cabrow{display:flex;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.cabrow .cabqty{min-width:54px;font-weight:800;font-size:1.25rem;color:#012060}
.cabrow .cabmain{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.cabrow .cabmain span{color:var(--muted);font-size:.9rem}
.cabrow .cabdate{font-weight:600;font-size:.85rem;color:var(--muted);white-space:nowrap}
.cabrow.wait{border-style:dashed}
.tool{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);cursor:pointer;width:100%;text-align:left;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s}
.tool:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.thumb{flex:0 0 72px;height:72px;border-radius:10px;background:var(--soft);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:.7rem}
.thumb img{width:100%;height:100%;object-fit:cover}
.tool .info{flex:1;min-width:0}
.tool .info strong{display:block;font-size:1.05rem}
.tool .info span{display:block;color:var(--muted);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool .info .serial,.serial{display:inline;font-weight:700;color:var(--ink)}
.tool .info .serial.check,.serial.check{color:var(--amber)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.photo{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--soft)}
.photo .pic{aspect-ratio:1/1;display:grid;place-items:center;color:var(--muted);font-size:.85rem}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo button{width:100%;border:0;border-top:1px solid var(--line);background:var(--card);padding:9px;cursor:pointer;font-weight:600}
@media (min-width:1100px){ .photos{max-width:640px} }

/* dayworks / works done */
.qbar{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:12px;padding:11px 16px;margin-bottom:14px;font-weight:600;font-size:.92rem}
.qbar.ok{background:#e7f5ec;color:var(--ok)}
.qbar.wait{background:#fff3e0;color:#7a4a0e}
.dwdate{font-size:.9rem;color:var(--muted);margin:14px 2px 2px;text-transform:uppercase;letter-spacing:.08em;grid-column:1/-1}
.tool.dw{align-items:flex-start}
.tool.dw .info span{white-space:normal}
.tool.dw .info span:last-child{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dwside{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}
.dwside b{font-family:"Barlow Condensed",sans-serif;font-size:1.8rem;line-height:1}
.dwcalc{margin:10px 0 0;color:var(--muted)}
.dwcalc b{color:var(--ink)}
.dwphotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.dwph{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--soft);display:grid;place-items:center;border:1px solid var(--line)}
.dwph img{width:100%;height:100%;object-fit:cover;display:block}
.dwph button{position:absolute;top:5px;right:5px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;cursor:pointer;font-size:.9rem}
.dwadd{aspect-ratio:1/1;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;cursor:pointer;font-weight:700;text-align:center;padding:6px}
.dwadd:hover{border-color:var(--ink)}
.dwmiss{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:#fdecea;color:var(--warn);font-weight:600}
.req{color:var(--warn)}
.dwhint{margin:6px 0 0;padding:8px 12px;border-radius:10px;background:#fff4e0;color:#8a4b0f;font-size:.9rem}
.namepick{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.namepick button{font:inherit;font-size:.82rem;padding:6px 10px;border-radius:999px;border:1px solid #c9ced6;background:#fff;color:var(--ink);cursor:pointer}
.namepick button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.modal .box p{white-space:pre-line}
.field input.bad,.field textarea.bad{border-color:var(--warn);background:#fff8f7}
.dwtable{width:100%;border-collapse:collapse;margin-top:6px}
.dwtable th,.dwtable td{text-align:left;vertical-align:top;padding:10px;border-bottom:1px solid var(--line)}
.dwtable th{width:32%;color:var(--muted);font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;background:var(--soft)}
.pdfout{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 16px;background:var(--card)}
.pdfout.bad{color:var(--warn);background:#fdecea;border-color:#f5c6c2}
.pdfout a:not(.btn){font-weight:700}
.hero .pdfout{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff;margin:14px 0 0;position:relative;z-index:1}
.hero .pdfout .btn.ghost{color:#fff}

/* loading */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
@keyframes slide{0%{left:-40%}100%{left:100%}}
.spin{display:inline-block;width:22px;height:22px;border:3px solid rgba(0,0,0,.12);border-top-color:var(--ink);border-radius:50%;animation:spin .75s linear infinite;flex:0 0 auto;vertical-align:middle}
.spin.sm{width:14px;height:14px;border-width:2px;margin-right:6px}
.spin.light{border-color:rgba(255,255,255,.2);border-top-color:#fff}
.loading{display:flex;align-items:center;justify-content:center;gap:12px;padding:48px 16px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.skel{display:block;border-radius:8px;background:linear-gradient(90deg,#e6ebf4 25%,#f4f7fc 50%,#e6ebf4 75%);background-size:300% 100%;animation:shimmer 1.3s ease-in-out infinite}
.hero .skel{background:linear-gradient(90deg,rgba(255,255,255,.08) 25%,rgba(255,255,255,.18) 50%,rgba(255,255,255,.08) 75%);background-size:300% 100%}
.skel.num{height:40px;width:70%;margin:4px 0 6px}
.skel.line{height:12px;width:85%;margin-top:6px}
.av.skel,.thumb.skel,.pic.skel,.dwph.skel{border-color:transparent}
.av.skel{border-radius:50%}
.tick.wait{pointer-events:none;background:linear-gradient(90deg,#e6ebf4 25%,#f4f7fc 50%,#e6ebf4 75%);background-size:300% 100%;animation:shimmer 1.3s ease-in-out infinite;border-color:transparent}
#topbar{display:none}
#splash{position:fixed;inset:0;z-index:50;background:#012060;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .35s}
#splash img{width:min(60vw,280px);height:auto}
#splash.gone{opacity:0;pointer-events:none}
.status .spin{border-color:rgba(255,255,255,.25);border-top-color:#fff}

/* credit */
.credit{display:none;font-size:.66rem;letter-spacing:.04em;color:#a3a3a3;text-align:center;margin:28px 0 0;opacity:.8}
nav.tabs .navcredit{display:none}

/* view and edit mode, log, list photos */
.modebar{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.modebar.editing{background:var(--brand);border-color:var(--brand);color:#fff}
.modebar.editing .btn{background:#fff;color:var(--brand);border-color:#fff}
.modebar .btn{padding:8px 14px;font-size:.85rem}
input[readonly],textarea[readonly]{background:var(--soft);color:var(--muted);cursor:pointer}
.tick.locked{opacity:.5}
.logrow{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.logrow:last-child{border-bottom:0}
.logrow .when{flex:0 0 104px;color:var(--muted);font-size:.78rem}
.logrow b{white-space:nowrap}
.dwthumbs{display:flex;gap:5px;margin-top:8px}
.srph{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.srimg{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--line)}
.srimg img{width:100%;height:100%;object-fit:cover;display:block}
.srimg .skel{display:block;width:100%;height:100%}
.srx{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:1.2rem;line-height:1;cursor:pointer}
.tag.rec{background:#e7f5ec;color:#1d6b3f}
.dwthumbs img,.dwthumbs .skel{width:56px;height:56px;border-radius:8px;object-fit:cover;display:block;border:1px solid var(--line)}
@media (max-width:620px){ .tool.dw{flex-wrap:wrap} .tool.dw .info{flex:1 1 60%} .dwthumbs{order:3;width:100%;margin-top:6px} }

.tag{display:inline-block;margin:0 0 4px;padding:2px 9px;border-radius:6px;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tag.var{background:#dce6f2;color:#012060}
.tag.crane{background:#ffe8cc;color:#8a4b0f}
.tag.big{font-size:.8rem;padding:4px 12px;margin-bottom:8px}
.tool .info .tag{display:inline-block;width:auto}

/* dialog */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:20;padding:16px}
.modal .box{background:#fff;border-radius:16px;padding:22px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal p{margin:0 0 16px;font-size:1.02rem}
.modal .box.wide{max-width:520px;max-height:calc(100vh - 32px);overflow:auto}
.modal .box .field{margin-top:12px}
.modal .box .msg{margin:10px 0 0}
.mhead{font-size:1.35rem;text-transform:uppercase;letter-spacing:.05em;margin:0 0 6px}
.profhead{display:flex;align-items:center;gap:14px;margin:6px 0 4px}
.av.big{flex:0 0 76px;height:76px;font-size:1.5rem;cursor:default}
.aglist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.agrow{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.agrow .btn{padding:8px 11px;font-size:.9rem;flex:0 0 auto}
.agrow:last-child{border-bottom:0}
.agrow .who{min-width:0}
.agdot{width:12px;height:12px;border-radius:3px;flex:0 0 auto}
.agadd{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* pours */
.pourwrap{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.pourwrap>*{min-width:0}
.pourpanel{overflow-wrap:anywhere}
.pourpanel .field input,.pourpanel .field select,.pourpanel .field textarea{width:100%;min-width:0;max-width:100%;box-sizing:border-box}
@media (min-width:1000px){.pourwrap{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
.plancard{position:relative;border:1px solid var(--line);border-radius:var(--radius);background:#fbfcfe;overflow:hidden;box-shadow:var(--shadow)}
.plancard svg{display:block;width:100%;height:62vh;height:62svh;min-height:320px;touch-action:none;user-select:none;-webkit-user-select:none}
.plantools{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.plantools button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:1.2rem;font-weight:700;color:var(--brand);cursor:pointer}
.plankey{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:0 0 12px;font-size:.88rem}
.plankey i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.pourcount{font-family:"Barlow Condensed",sans-serif;font-size:1.6rem;font-weight:700;color:var(--brand)}
.pourpanel{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:16px 18px;box-shadow:var(--shadow)}
.pourpanel h2{font-size:1.7rem;color:var(--brand)}
.pourpanel .grid2{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0 14px;font-size:.95rem}
.pourpanel .grid2 span:nth-child(odd){color:var(--muted)}
.pourpanel .field{margin-bottom:12px}
.pourphotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 12px}
.pourphotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--soft);cursor:zoom-in}
.pourbig{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center}
.pourbig img{max-width:96vw;max-height:90vh}

/* ---------- PDF editor ---------- */
.pe-start{max-width:560px}
.pe-bar{position:sticky;top:var(--top);z-index:4;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bg);padding:8px 0 10px;margin:-8px 0 6px}
.pe-group{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.pe-group button{border:0;background:transparent;min-width:42px;height:42px;border-radius:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink);padding:0 6px;font-size:.66rem;font-weight:600}
.pe-group button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pe-group button b{font-size:1.4rem;line-height:1}
.pe-group button[aria-pressed="true"]{background:var(--brand);color:#fff}
.pe-group button:disabled{opacity:.35}
.pe-group #peZoom{min-width:44px;text-align:center;font-weight:700;font-size:.9rem}
.pe-sw i{display:block;width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.pe-sw[aria-pressed="true"]{background:var(--soft)!important}
.pe-sw[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--brand)}
.pe-group.off{opacity:.35}
.pe-sz i{display:block;border-radius:50%;background:currentColor}
.pe-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.pe-actions #peName{margin-right:auto}
.pe-pages{overflow-x:auto;display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding-bottom:20px}
.pe-page{position:relative;flex:0 0 auto;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15),0 6px 20px rgba(0,0,0,.08);margin:0 auto}
.pe-page canvas{position:absolute;inset:0;width:100%;height:100%}
.pe-over{mix-blend-mode:multiply}
.pe.drawing .pe-over{touch-action:none}
@media (max-width:600px){ .pe-group button span{display:none} .pe-bar{flex-wrap:nowrap;overflow-x:auto;margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px} .pe-group{flex:0 0 auto} .pe-actions #peName{width:100%} .pe-actions .btn{flex:1} }
</style>
</head>

<script>
// ================= constants =================
const DEFAULT_LOGO = document.getElementById("logoBlack").src;
const WHITE_LOGO = document.getElementById("logo").src;
const BUILTIN_PHOTOS = {};
const AG_COLORS = {"DCOR Construction":"#012060","Talcon Group":"#1F6FB2","Adebura":"#2E7D4F","Dragos":"#7B3FA0","Petru Pirtac":"#B03A5B","Aitken":"#2F6F7A"};
const AG_ORDER = Object.keys(AG_COLORS);
// trades: these are the defaults; the real list comes from the Settings tab of the timesheet
let TRADES = [["SM","Site Manager"],["SR","Safety Rep"],["FFM","Fixing Foreman"],["C","Chippy"],["SF","Steel Fixer"],["CF","Concrete Finisher"],["GO","General Operative"],["BM","Banksman"]];
let TRADE_LABEL = Object.fromEntries(TRADES);
let TRADE_RANK = Object.fromEntries(TRADES.map(([c],i)=>[c,i]));
function setTrades(list){
  if (!Array.isArray(list) || !list.length) return;
  TRADES = list.map(([c, n]) => [String(c), String(n || c)]);
  TRADE_LABEL = Object.fromEntries(TRADES);
  TRADE_RANK = Object.fromEntries(TRADES.map(([c],i)=>[c,i]));
}
const DAYS = ["mon","tue","wed","thu","fri","sat"];
const DAY_LABEL = ["Mon","Tue","Wed","Thu","Fri","Sat"];
const STATUSES = ["In store","On site","With a lad","In repair","Off hired","Missing"];
const TICK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const VIEW_TITLES = {home:"Home", attendance:"Attendance", timesheet:"Timesheet", dayworks:"Variations", pours:"Pours", works:"Works Done", talks:"Toolbox Talks", tools:"Tools", cabinet:"Cabinet", pdfedit:"PDF Editor"};

// ================= helpers =================
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-");
const initials = n => String(n).replace(/-/g," ").split(" ").filter(Boolean).slice(0,2).map(p=>p[0]).join("").toUpperCase();
function mondayOf(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fromIso = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s||""); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };
const nice = d => d.toLocaleDateString("en-IE",{day:"numeric",month:"short"});
const fmtH = n => (Math.round(n*10)/10).toFixed(1);
function setStatus(t, ok){
  const el = $("status");
  el.innerHTML = (/…$/.test(t) ? '<span class="spin sm"></span>' : "") + esc(t);
  el.classList.toggle("ok", !!ok);
}
const HAS_GAS = !!(window.google && google.script && google.script.run);
const API_URL = String(window.SITE_APP_API || "").trim();
function getPin(){ try{ return localStorage.getItem("siteAppPin") || ""; }catch(e){ return ""; } }
function getWho(){ try{ return localStorage.getItem("siteAppWho") || ""; }catch(e){ return ""; } }
function askWho(){
  if (getWho() || document.getElementById("whoForm")) return;
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<form class="box" id="whoForm"><h2 style="text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Who's using this?</h2>
    <p class="muted">Your name goes on the change log, so everyone can see who changed what.</p>
    <input id="whoBox" autocomplete="name" placeholder="e.g. Jack" style="width:100%;font-size:1.1rem;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px">
    <button class="btn" style="width:100%">Start</button></form>`;
  document.body.appendChild(m);
  $("whoBox").focus();
  $("whoForm").onsubmit = ev => {
    ev.preventDefault();
    const v = $("whoBox").value.trim().slice(0, 40);
    if (!v) return;
    try{ localStorage.setItem("siteAppWho", v); }catch(e){}
    m.remove();
  };
}
let pinAsked = false;
function askPin(message){
  if (pinAsked) return;
  pinAsked = true;
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<form class="box" id="pinForm"><h2 style="text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Enter the app PIN</h2>
    <p class="muted">${esc(message || "Ask Jack for the PIN.")}</p>
    <input id="pinBox" type="password" inputmode="numeric" autocomplete="off" style="width:100%;font-size:1.4rem;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px">
    <button class="btn" style="width:100%">Open the app</button></form>`;
  document.body.appendChild(m);
  $("pinBox").focus();
  $("pinForm").onsubmit = ev => {
    ev.preventDefault();
    try{ localStorage.setItem("siteAppPin", $("pinBox").value.trim()); }catch(e){}
    location.reload();
  };
}
let inflight = 0;
function busy(delta){ inflight = Math.max(0, inflight + delta); }
let lastOk = 0, failStreak = 0;
const isNetworkError = e => /signal|connection|network|fetch|unavailable/i.test((e && e.message) || "");
function tracked(p){
  return p.then(r => { lastOk = Date.now(); failStreak = 0; return r; },
    e => { if (e && e.code !== "PIN") failStreak++; throw e; });
}
// one quiet retry: site signal drops for a second all the time
function withRetry(fn, args){
  return rawServer(fn, ...args).catch(e => {
    if (e && (e.code === "PIN" || !isNetworkError(e))) throw e;
    return new Promise(r => setTimeout(r, 1200)).then(() => rawServer(fn, ...args));
  });
}
function server(fn, ...args){
  busy(1);
  return tracked(withRetry(fn, args)).finally(() => busy(-1));
}
function bgServer(fn, ...args){ return tracked(withRetry(fn, args)); }
// only worth telling them about if nothing has worked for a while
function connectionTrouble(msg){
  if (failStreak >= 2 && Date.now() - lastOk > 15000) setStatus(msg || "No signal. Using the saved copy");
}
function rawServer(fn, ...args){
  if (HAS_GAS){
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
  }
  if (!API_URL) return Promise.reject(new Error("The app isn't linked to Google yet. Put the web app link in config.js."));
  return fetch(API_URL, {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify({fn, args, pin: getPin(), who: getWho()}),
    redirect: "follow",
  }).then(r => {
    if (!r.ok) throw new Error("No connection to Google right now.");
    return r.json();
  }).then(j => {
    if (j && j.ok) return j.result;
    const e = new Error((j && j.error) || "Something went wrong.");
    if (j && j.code === "PIN"){ e.code = "PIN"; clearCache(); askPin(j.error); }
    throw e;
  }, e => { if (e.code === "PIN") throw e; throw new Error(e && e.message && !/fetch/i.test(e.message) ? e.message : "No signal. Check your connection."); });
}
const errText = (e, fallback) => (e && e.message) ? e.message.replace(/^Error:\s*/,"") : fallback;
let saveQueue = Promise.resolve(), pending = 0;
function queueSave(fn, okText){
  pending++; setStatus("Saving…");
  saveQueue = saveQueue.then(fn).then(() => { pending--; if (!pending) setStatus(okText || "Saved", true); })
    .catch(e => { pending--; setStatus(errText(e, "Couldn't save. Check your signal and try again")); });
  return saveQueue;
}
function ask(message, okLabel, danger){
  return new Promise(resolve => {
    const m = document.createElement("div");
    m.className = "modal";
    m.innerHTML = `<div class="box" role="dialog" aria-modal="true"><p>${esc(message)}</p><div class="row-actions">
      <button class="btn ${danger ? "danger" : ""}" data-a="ok">${esc(okLabel)}</button><button class="btn ghost" data-a="no">Cancel</button></div></div>`;
    m.onclick = ev => { const a = ev.target.dataset.a; if (a || ev.target === m){ m.remove(); resolve(a === "ok"); } };
    document.body.appendChild(m);
    m.querySelector("[data-a=ok]").focus();

function shrinkImage(file, size, square){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      if (square){
        const s = Math.min(img.width, img.height);
        c.width = c.height = size;
        c.getContext("2d").drawImage(img, (img.width-s)/2, Math.max(0,(img.height-s)/3), s, s, 0, 0, size, size);
      } else {
        const k = Math.min(1, size / Math.max(img.width, img.height));
        c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      }
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", square ? 0.82 : 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("That file isn't a photo.")); };
    img.src = url;
  });
}

// Made here on the phone so the faces can go on it. Extras.gs then saves it to Drive for a share link.
const HC_NAVY = "#012060", HC_TINT = "#DCE6F2", HC_LINE = "#B8C4D6", HC_GREY = "#5A6478", HC_GREEN = "#1E7A3C", HC_RED = "#B3261E";
const HC_TRADE_ORDER = ["Carpenter", "Steel Fixer", "Chippy Labourer", "General Operative", "Fixing Foreman", "Site Manager", "Safety Rep"];
const HC_SITE = "Patrician Secondary School, Newbridge";
// jsPDF and the navy logo come from loadJsPdf() and navyLogo(), further down (shared with the pour PDF)
function hcTrade(l){
  const label = String(TRADE_LABEL[l.code] || l.trade || "").trim();
  if (!label) return "Trade not set";
  return /^chippy$/i.test(label) || /^carpenter$/i.test(label) ? "Carpenter" : label;
}
function loadImg(src){
  return new Promise(resolve => {
    if (!src) return resolve(null);
    const im = new Image();
    if (/^https?:/i.test(src)) im.crossOrigin = "anonymous";
    im.onload = () => resolve(im);
    im.onerror = () => resolve(null);
    im.src = src;
  });
}
// a round face on white, or the lad's initials if there's no photo
async function hcFace(l, px){
  const draw = im => {
    const c = document.createElement("canvas"); c.width = c.height = px;
    const g = c.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, px, px);
    g.save(); g.beginPath(); g.arc(px/2, px/2, px/2, 0, Math.PI*2); g.clip();
    if (im){
      const s = Math.min(im.naturalWidth, im.naturalHeight);
      g.drawImage(im, (im.naturalWidth - s)/2, (im.naturalHeight - s)/2, s, s, 0, 0, px, px);
    } else {
      g.fillStyle = HC_TINT; g.fillRect(0, 0, px, px);
      g.fillStyle = HC_NAVY; g.font = `bold ${Math.round(px*0.38)}px Helvetica, Arial, sans-serif`;
      g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(initials(l.name), px/2, px/2 + 1);
    }
    g.restore();
    return c.toDataURL("image/jpeg", 0.85);
  };
  const im = await loadImg(ladPhoto(l));
  try{ return draw(im); }catch(e){ return draw(null); }
}
async function makeHeadcountPdf(){
  if (!S.booted || !A.ready) throw new Error("Attendance is still loading. Try again in a moment.");
  const jsPDF = await loadJsPdf();
  const day = new Date(A.week); day.setDate(day.getDate() + A.day);
  const dayKey = DAYS[A.day];
  const dd = String(day.getDate()).padStart(2, "0"), mm = String(day.getMonth()+1).padStart(2, "0"), yy = String(day.getFullYear());
  const wd = day.toLocaleDateString("en-GB", {weekday: "long"});
  const dateLabel = `${wd} ${dd}/${mm}/${yy.slice(2)}`;
  const fileName = `Headcount_${wd.slice(0,3)}_${dd}-${mm}-${yy.slice(2)}.pdf`;

  const lads = S.lads.map(l => ({...l, hcTrade: hcTrade(l), isIn: ticked(l.id, dayKey), hcAgency: l.agency === "No agency" ? "Agency not set" : l.agency}));
  const X = lads.filter(l => l.isIn).length, Y = lads.length;
  const found = [...new Set(lads.map(l => l.hcTrade))];
  const trades = [...HC_TRADE_ORDER.filter(t => found.includes(t)),
    ...found.filter(t => !HC_TRADE_ORDER.includes(t) && t !== "Trade not set").sort(),
    ...(found.includes("Trade not set") ? ["Trade not set"] : [])];
  const agencies = [...new Set(lads.map(l => l.hcAgency))];
  const faces = {};
  await Promise.all(lads.map(async l => { faces[l.id] = await hcFace(l, 160); }));
  const logo = await navyLogo();

  const doc = new jsPDF({unit: "mm", format: "a4"});
  doc.setProperties({title: `Headcount ${dateLabel}`, author: "New Bridge Form"});
  const W = 210, H = 297, M = 16, BOTTOM = H - 22;
  const txt = (s, x, y, o) => doc.text(String(s), x, y, o);
  const font = (style, size, color) => { doc.setFont("helvetica", style); doc.setFontSize(size); doc.setTextColor(color); };

  // header
  if (logo){ const lw = 50, lh = lw * logo.r; doc.addImage(logo.url, "PNG", M, 24 - lh, lw, lh, "nbflogo", "FAST"); }
  else { font("bold", 16, HC_NAVY); txt("NEW BRIDGE FORM", M, 20); }
  font("normal", 10, HC_GREY); txt(HC_SITE, M, 30);
  font("bold", 16, HC_NAVY); txt("Headcount", W - M, 17, {align: "right"});
  font("normal", 10.5, "#000000"); txt(dateLabel, W - M, 23.5, {align: "right"});
  doc.setDrawColor(HC_NAVY); doc.setLineWidth(0.42); doc.line(M, 34, W - M, 34);

  // X of Y
  font("bold", 28, HC_NAVY); txt(`${X} of ${Y}`, M, 48);
  const bw = doc.getTextWidth(`${X} of ${Y}`);
  font("normal", 11.5, HC_GREY); txt("in today", M + bw + 5, 46.5);

  // by trade
  let y = 58;
  font("bold", 12.5, HC_NAVY); txt("By trade", M, y);
  y += 2;
  const rh = 5.6, cw = [70, 30, 30];
  const trow = (vals, head, bold, fill) => {
    let x = M;
    vals.forEach((v, i) => {
      doc.setFillColor(head ? HC_NAVY : (fill || "#FFFFFF")); doc.setDrawColor(HC_LINE); doc.setLineWidth(0.2);
      doc.rect(x, y, cw[i], rh, "FD");
      font(head || bold ? "bold" : "normal", 10.5, head ? "#FFFFFF" : "#000000");
      if (i === 0) txt(v, x + 3, y + rh - 1.7); else txt(v, x + cw[i]/2, y + rh - 1.7, {align: "center"});
      x += cw[i];
    });
    y += rh;
  };
  trow(["Trade", "In today", "Total"], true);
  trades.forEach(t => trow([t, lads.filter(l => l.hcTrade === t && l.isIn).length, lads.filter(l => l.hcTrade === t).length]));
  trow(["Total", X, Y], false, true, HC_TINT);

  // In today / Not in, grouped by agency, each lad with his face
  const top1 = y + 6, colw = (W - 2*M - 8) / 2, BAR = 8, AGH = 5.2, SEP = 2, TOP2 = 30;
  // row height: as roomy as possible while still fitting on one page, but never so small the faces get lost
  const need = want => { const ags = agencies.filter(a => lads.some(l => l.hcAgency === a && l.isIn === want)).length;
    return {n: lads.filter(l => l.isIn === want).length, extra: ags * (AGH + SEP)}; };
  const fitRH = Math.min(...[true, false].map(w => { const k = need(w); return k.n ? (BOTTOM - top1 - BAR - k.extra) / k.n : 99; }));
  const RH = Math.max(5.5, Math.min(7.2, fitRH)), FACE = RH - 1.3;
  const columns = [
    {title: `In today (${X})`, color: HC_GREEN, x: M, want: true},
    {title: `Not in (${Y - X})`, color: HC_RED, x: M + colw + 8, want: false},
  ];
  // lay each column out over as many pages as it needs
  let pages = 1;
  for (const col of columns){
    const items = [];
    agencies.forEach(ag => {
      const rows = lads.filter(l => l.hcAgency === ag && l.isIn === col.want);
      if (!rows.length) return;
      items.push({kind: "ag", h: AGH, text: ag, keep: RH});
      rows.forEach(l => items.push({kind: "lad", h: RH, lad: l}));
      items.push({kind: "sep", h: SEP});
    });
    let p = 1, yy = top1 + BAR;
    col.place = [];
    for (const it of items){
      if (yy + it.h + (it.keep || 0) > BOTTOM && it.kind !== "sep"){ p++; yy = TOP2 + BAR; }
      col.place.push({...it, page: p, y: yy});
      yy += it.h;
    }
    col.pages = p;
    pages = Math.max(pages, p);
  }
  for (let p = 1; p <= pages; p++){
    if (p > 1){
      doc.addPage();
      font("bold", 12, HC_NAVY); txt(`Headcount  ${dateLabel}  (continued)`, M, 20);
      doc.setDrawColor(HC_NAVY); doc.setLineWidth(0.42); doc.line(M, 24, W - M, 24);
    }
    for (const col of columns){
      const mine = col.place.filter(it => it.page === p);
      if (p > 1 && !mine.length) continue;
      const barY = p === 1 ? top1 : TOP2;
      doc.setFillColor(col.color); doc.rect(col.x, barY, colw, BAR, "F");
      font("bold", 11.5, "#FFFFFF"); txt(col.title + (p > 1 ? " continued" : ""), col.x + 3, barY + 5.6);
      for (const it of mine){
        if (it.kind === "ag"){ font("bold", 10, HC_NAVY); txt(it.text, col.x + 2, it.y + 4.1); }
        if (it.kind === "lad"){
          const l = it.lad, fy = it.y + (RH - FACE)/2;
          doc.addImage(faces[l.id], "JPEG", col.x + 3, fy, FACE, FACE);
          doc.setDrawColor(HC_LINE); doc.setLineWidth(0.2); doc.circle(col.x + 3 + FACE/2, fy + FACE/2, FACE/2, "S");
          font("normal", 9.8, "#000000"); txt(l.name, col.x + 3 + FACE + 2.5, it.y + RH/2 + 1.3);
          font("normal", 8.6, HC_GREY); txt(l.hcTrade, col.x + colw - 3, it.y + RH/2 + 1.3, {align: "right"});
        }
        if (it.kind === "sep"){ doc.setDrawColor(HC_LINE); doc.setLineWidth(0.18); doc.line(col.x + 2, it.y + 1.2, col.x + colw - 2, it.y + 1.2); }
      }
    }
    doc.setDrawColor(HC_LINE); doc.setLineWidth(0.2); doc.line(M, H - 16, W - M, H - 16);
    font("normal", 8, HC_GREY);
    txt(`New Bridge Form  |  From the site app attendance for ${dd}/${mm}/${yy}`, M, H - 11.5);
    if (pages > 1) txt(`Page ${p} of ${pages}`, W - M, H - 11.5, {align: "right"});
  }

  const blob = doc.output("blob");
  const blobUrl = URL.createObjectURL(blob);
  let file = null;
  try{ file = new File([blob], fileName, {type: "application/pdf"}); }catch(e){}
  const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
  try{
    const up = await server("saveHeadcountPdf", String(dataUrl).replace(/^data:[^,]*;base64,/, "data:application/pdf;base64,"), fileName);
    return {url: up.url, name: up.name, blobUrl, file};
  }catch(e){
    const msg = errText(e, "");
    return {url: "", name: fileName, blobUrl, file,
      note: /Unknown action/i.test(msg) ? "Saved on this device only. Add Extras.gs to the Apps Script to get a share link." : "Saved on this device only, so there's no share link. Download it and send it from your Downloads."};
  }
}

async function editLad(lad){
  let newPhoto = "";
  const ags = agencyOptions();
  const cur = lad.agency === "No agency" ? "" : lad.agency;
  const m = openModal(`<form id="ladForm"><h2 class="mhead">Edit lad</h2>
    <div class="profhead"><div class="av big" style="--c:${agColor(lad.agency)}" id="profPic">${ladPhoto(lad) ? `<img src="${ladPhoto(lad)}" alt="">` : esc(initials(lad.name))}</div>

    <label class="field">Trade<select id="ladTrade">${lad.code && !TRADE_LABEL[lad.code] ? `<option value="${esc(lad.code)}" selected>${esc(lad.code)}</option>` : ""}${!lad.code ? `<option value="" selected>No trade set</option>` : ""}${TRADES.map(([c, l]) => `<option value="${esc(c)}"${c === lad.code ? " selected" : ""}>${esc(l)}</option>`).join("")}</select></label>
    <p class="msg" id="ladMsg"></p>
    <div class="row-actions" style="margin-top:14px"><button class="btn" id="ladSave">Save</button><button type="button" class="btn ghost" data-a="no">Cancel</button>
      <button type="button" class="btn danger" data-a="remove" style="margin-left:auto">Remove lad</button></div></form>`);
  m.querySelector(".box").classList.add("wide");
  const close = () => m.remove();
  m.querySelector("#ladAgency").onchange = ev => { m.querySelector("#ladNewAgWrap").hidden = ev.target.value !== "__new"; };
  m.onclick = async ev => {
    const a = ev.target.closest("[data-a]") ? ev.target.closest("[data-a]").dataset.a : "";
    if (a === "no" || ev.target === m) close();
    if (a === "photo"){
      const file = await pickImage();
      if (!file) return;
      try{ newPhoto = await shrinkImage(file, 320, true); m.querySelector("#profPic").innerHTML = `<img src="${newPhoto}" alt="">`; }
      catch(e){ m.querySelector("#ladMsg").textContent = "Couldn't use that photo."; }
    }
    if (a === "remove"){ close(); removeLadFlow(lad); }
  };
  m.querySelector("#ladForm").onsubmit = async ev => {
    ev.preventDefault();
    const msg = m.querySelector("#ladMsg");
    const name = m.querySelector("#ladName").value.trim().replace(/\s+/g, " ");
    let agency = m.querySelector("#ladAgency").value;
    if (agency === "__new") agency = m.querySelector("#ladNewAg").value.trim().replace(/\s+/g, " ");
    const trade = m.querySelector("#ladTrade").value;
    if (!name){ msg.textContent = "Type his name."; return; }
    if (!agency){ msg.textContent = m.querySelector("#ladAgency").value === "__new" ? "Type the new agency's name." : "Pick an agency."; return; }
    if (slug(name) !== lad.id && S.lads.some(l => l.id === slug(name))){ msg.textContent = name + " is already on the list."; return; }
    const changes = {};
    if (name !== lad.name) changes.name = name;
    if (agency !== cur) changes.agency = agency;
    if (trade !== lad.code) changes.trade = trade;
    if (!Object.keys(changes).length && !newPhoto){ close(); return; }
    m.querySelector("#ladSave").disabled = true; msg.textContent = "Saving…";
    try{
      if (Object.keys(changes).length){
        const d = await server("updateLad", lad.name, changes).catch(e => { throw needScript(e); });
        const newId = slug(name);
        if (newId !== lad.id){
          // carry his photo and ticks across to his new name on this phone too
          if (S.ladPhotos[lad.id]){ S.ladPhotos = {...S.ladPhotos, [newId]: S.ladPhotos[lad.id]}; delete S.ladPhotos[lad.id]; cacheSet("ladPhotos", S.ladPhotos); }

        }
        setLadData(d);
      }
      if (newPhoto){ S.ladPhotos = {...S.ladPhotos, [slug(name)]: newPhoto}; cacheSet("ladPhotos", S.ladPhotos); await server("savePhoto", name, newPhoto); }
      close(); render(); setStatus(`${name} saved`, true);
    }catch(e){
      msg.textContent = errText(e, "Couldn't save. Check your signal and try again.");
      m.querySelector("#ladSave").disabled = false;
    }
  };
  m.querySelector("#ladName").focus();
}

// ---- attendance ticks: grouped, sent a few at a time, kept on this device until Google confirms ----
const TICKQ = {map: null, timer: 0, busy: false, again: false};
async function tickQLoad(){ if (!TICKQ.map){ try{ TICKQ.map = (await kvGet("tickQueue")) || {}; }catch(e){ TICKQ.map = {}; } } return TICKQ.map; }
function tickQSave(){ kvSet("tickQueue", TICKQ.map || {}).catch(() => {}); }
// ticks still waiting to send win over what Google sent back, so nothing flickers off
function overlayTicks(ws, ticks){
  const out = {...(ticks || {})};
  for (const t of Object.values(TICKQ.map || {})) if (t.ws === ws) out[t.id] = {...(out[t.id] || {}), [t.day]: t.val};
  return out;
}
async function queueTick(ws, id, name, day, val){
  await tickQLoad();
  TICKQ.map[`${ws}|${id}|${day}`] = {ws, id, name, day, val, t: Date.now()};
  tickQSave();
  setStatus("Saving…");
  clearTimeout(TICKQ.timer);
  TICKQ.timer = setTimeout(flushTicks, 600);
}
async function flushTicks(){
  await tickQLoad();
  if (TICKQ.busy){ TICKQ.again = true; return; }
  const work = Object.entries(TICKQ.map);
  if (!work.length) return;
  TICKQ.busy = true;
  let failed = 0, pinStop = false;
  const worker = async () => {
    while (work.length && !pinStop){
      const [k, t] = work.shift();
      try{
        await bgServer("setTick", t.ws, t.id, t.name, t.day, t.val);
        if (TICKQ.map[k] && TICKQ.map[k].t === t.t) delete TICKQ.map[k];   // a newer tap on the same box stays queued
      }catch(e){ failed++; if (e && e.code === "PIN") pinStop = true; }
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
  tickQSave();
  TICKQ.busy = false;
  const left = Object.keys(TICKQ.map).length;
  if (TICKQ.again){ TICKQ.again = false; return flushTicks(); }
  if (!left) setStatus("Saved", true);
  else if (failed){ setStatus(`${left} tick${left === 1 ? "" : "s"} not sent yet. Safe on this device, trying again`); setTimeout(flushTicks, 15000); }
  else flushTicks();
}
async function loadAttendance(){
  const ws = iso(A.week);
  A.loaded = ws; A.ticks = {}; A.ready = false;
  const cached = await cacheGet("week:" + ws);
  if (A.loaded === ws && cached){ A.ticks = cached; A.ready = true; }
  if (S.view === "attendance") render();
  try{
    const data = await server("getWeek", ws);
    if (A.loaded === ws){
      await tickQLoad();
      A.ticks = overlayTicks(ws, data || {}); A.ready = true;
      cacheSet("week:" + ws, A.ticks);
      if (S.view === "attendance" && !pending) render();
      setStatus("Up to date", true);
    }
  }catch(e){
    if (A.loaded === ws){ A.ready = true; if (S.view === "attendance") render(); }
    connectionTrouble("Couldn't load this week. Using the saved copy");
  }
}

// Every save goes into a queue on this device first (IndexedDB), then is sent to Google.
// A record only leaves the queue once Google confirms the record AND every photo is in Drive.
const DWQ = {db: null, mem: new Map(), ready: null, busy: false, failed: ""};
DWQ.ready = new Promise(resolve => {
  try{
    const req = indexedDB.open("site-app", 1);
    req.onupgradeneeded = () => { const d = req.result; d.createObjectStore("jobs", {keyPath: "key"}); d.createObjectStore("kv"); };
    req.onsuccess = () => { DWQ.db = req.result; resolve(); };
    req.onerror = () => resolve();
  }catch(e){ resolve(); }
});
function idb(store, mode, fn){
  return new Promise((resolve, reject) => {
    const tx = DWQ.db.transaction(store, mode);
    const st = tx.objectStore(store);
    let out;
    Promise.resolve(fn(st)).then(r => { out = r; });
    tx.oncomplete = () => resolve(out);
    tx.onerror = () => reject(tx.error || new Error("Storage error"));
    tx.onabort = () => reject(tx.error || new Error("Storage full"));
  });
}
const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function jobsAll(){
  await DWQ.ready;
  if (!DWQ.db) return [...DWQ.mem.values()].filter(j => j && j.key && !String(j.key).startsWith("kv:")).sort((a,b)=>a.ts-b.ts);
  const all = await idb("jobs", "readonly", st => reqP(st.getAll()));
  return (all || []).map(j => ({kind: "dayworks", ...j})).sort((a,b)=>a.ts-b.ts);
}
async function jobPut(job){ await DWQ.ready; if (!DWQ.db){ DWQ.mem.set(job.key, job); return; } await idb("jobs", "readwrite", st => reqP(st.put(job))); }
async function jobGet(key){
  await DWQ.ready;
  if (!DWQ.db) return DWQ.mem.get(key) || null;
  const j = await idb("jobs", "readonly", st => reqP(st.get(key)));
  return j ? {kind: "dayworks", ...j} : null;
}
async function jobDel(key){ await DWQ.ready; if (!DWQ.db){ DWQ.mem.delete(key); return; } await idb("jobs", "readwrite", st => reqP(st.delete(key))); }
async function kvSet(k, v){ await DWQ.ready; if (!DWQ.db){ DWQ.mem.set("kv:"+k, v); return; } await idb("kv", "readwrite", st => reqP(st.put(v, k))); }
async function kvGet(k){ await DWQ.ready; if (!DWQ.db) return DWQ.mem.get("kv:"+k) || null; return (await idb("kv", "readonly", st => reqP(st.get(k)))) || null; }

function parseDet(desc){
  const s = String(desc || "");
  const i = s.indexOf(DET_HEAD);
  if (i < 0) return {work: s, det: {}, has: false};
  const det = {};
  const byLabel = Object.fromEntries(DET_FIELDS.map(f => [f[1].toLowerCase(), f[0]]));
  s.slice(i + DET_HEAD.length).split("\n").forEach(line => {
    const m = /^([^:]+):\s?(.*)$/.exec(line.trim());
    if (m && byLabel[m[1].trim().toLowerCase()]) det[byLabel[m[1].trim().toLowerCase()]] = m[2].trim();
  });
  return {work: s.slice(0, i).replace(/\s+$/, ""), det, has: true};
}

function composeDet(work, rec){
  const lines = detFieldsFor(rec.type)
    .map(([k, label]) => [label, String(rec["x_" + k] || "").replace(/\s*\n\s*/g, " / ").trim()])
    .filter(([, v]) => v)
    .map(([label, v]) => `${label}: ${v}`);
  const w = String(work || "").replace(/\s+$/, "");
  return lines.length ? `${w}\n\n${DET_HEAD}\n${lines.join("\n")}` : w;
}
function nextRef(type){

  const pre = type === "Crane delay" ? "DL" : "VO", t = type === "Crane delay" ? "Crane delay" : "Variation";
  let max = t === "Variation" ? 14 : 5;
  if (RS("dayworks") && RS("dayworks").list){
    const nums = easNumbers();
    mergedRecords("dayworks").forEach(r => { if (easType(r) === t) max = Math.max(max, nums[r.id] || 0); });

    kindJobs("dayworks").filter(j => j.rec && easType(j.rec) === t).forEach(j => { const m = /^(?:VO|CD|DL)-(\d+)$/.exec(parseDet(j.rec.description).det.ref || ""); if (m) max = Math.max(max, +m[1]); });
  }
  return `${pre}-${String(max + 1).padStart(3, "0")}`;
}

async function queueRecordSave(kind, rec, newPhotos, removed){
  const key = "save:" + rec.id;
  const old = await jobGet(key);
  const job = old || {key, kind, id: rec.id, ts: Date.now(), newPhotos: [], removed: []};
  job.kind = kind;
  job.rec = rec;
  job.error = "";
  for (const p of newPhotos) job.newPhotos.push({name: p.name, data: p.data, sent: false});
  for (const name of removed){
    const i = job.newPhotos.findIndex(p => p.name === name);
    if (i >= 0) job.newPhotos.splice(i, 1);
    else if (!job.removed.includes(name)) job.removed.push(name);
  }
  await jobPut(job);
  await refreshJobs();
  processQueue();
}

function sameRec(K, a, b){
  return K.textFields.every(k => k === "dateTo"
      ? String(a[k] || a.dateFrom || "").trim() === String(b[k] || b.dateFrom || "").trim()
      : String(a[k]||"").trim() === String(b[k]||"").trim()) &&
    ["chippies","fixers","operatives"].every(k => Number(a[k]||0) === Number(b[k]||0));
}
async function processQueue(){
  if (DWQ.busy) return;
  DWQ.busy = true; updateQueueBadges();
  const rejected = [];
  try{
    for (const job of await jobsAll()){
      const kind = job.kind || "dayworks", K = KINDS[kind], st = RS(kind);
      if (job.del){
        await server("deleteRecord", kind, job.id);
        await jobDel(job.key);
        if (st.list) st.list = st.list.filter(r => r.id !== job.id);
        continue;
      }
      let saved;
      try{ saved = await server("saveRecord", kind, job.rec); }
      catch(e){
        if (isNetworkError(e) || e.code === "PIN") throw e;
        // Google said no (e.g. missing times or men): mark this one and carry on with the rest
        if (String(job.id).startsWith("dw-rc-") && (st.list || []).some(r => r.id === job.id)){ await jobDel(job.key); continue; }
        job.error = errText(e, "Google wouldn't take this one.");
        await jobPut(job);
        rejected.push(job);
        continue;
      }
      if (!sameRec(K, saved, job.rec)) throw new Error("Google saved something different. Retrying.");
      for (const name of job.removed) await server("removeRecordPhoto", kind, job.id, name);
      // two photos at a time: quicker on site, still safe
      const toSend = job.newPhotos.filter(p => !p.sent);
      for (let i = 0; i < toSend.length; i += 2){
        const pair = toSend.slice(i, i + 2);
        await Promise.all(pair.map(p => server("saveRecordPhoto", kind, job.id, p.name, p.data).then(() => { p.sent = true; })));
        await jobPut(job);
        await refreshJobs();
      }
      const fin = await server("finalizeRecord", kind, job.id);
      const missing = job.newPhotos.filter(p => !fin.names.includes(p.name));
      const stillThere = job.removed.filter(n => fin.names.includes(n));
      if (missing.length || stillThere.length){
        missing.forEach(p => p.sent = false);
        await jobPut(job);
        throw new Error(`${missing.length} photo${missing.length===1?"":"s"} didn't reach Drive. Retrying.`);
      }
      // only now is it safe to forget the local copy
      const latest = await jobGet(job.key);
      if (latest && latest.rec && JSON.stringify(latest.rec) === JSON.stringify(job.rec) &&
          latest.newPhotos.length === job.newPhotos.length && latest.removed.length === job.removed.length){
        await jobDel(job.key);
      } else if (latest){
        latest.newPhotos.forEach(p => { if (job.newPhotos.some(q => q.name === p.name)) p.sent = true; });
        latest.removed = latest.removed.filter(n => !job.removed.includes(n));
        await jobPut(latest);
      }
      saved.photos = fin.count;
      if (st.list){
        const i = st.list.findIndex(r => r.id === saved.id);
        if (i >= 0) st.list[i] = saved; else st.list.push(saved);
      }
      if (st.photos[job.id]){
        for (const p of job.newPhotos) st.photos[job.id][p.name] = p.data;
        for (const n of job.removed) delete st.photos[job.id][n];
      }
    }
    DWQ.failed = rejected.length ? `${rejected.length} entr${rejected.length === 1 ? "y needs" : "ies need"} fixing before ${rejected.length === 1 ? "it" : "they"} can send. Open the ones marked Needs fixing, tap Edit and fill in what's missing.` : "";
    for (const kind of Object.keys(KINDS)) if (!RS(kind).list) loadRecords(kind);
  }catch(e){
    DWQ.failed = errText(e, "No signal");
    connectionTrouble();
  }finally{
    DWQ.busy = false;
    await refreshJobs();
    if (!S.rec.jobs.length && !DWQ.failed && !pending) setStatus("All saved", true);
    else if (DWQ.failed && failStreak >= 2) setStatus("Not sent yet. It's safe on this device");
    if (KINDS[S.view] && RS(S.view).view !== "form") render();
  }
}

function mergedRecords(kind){
  const K = KINDS[kind], st = RS(kind);
  const byId = new Map((st.list || []).map(r => [r.id, {...r, pending: false}]));
  for (const j of kindJobs(kind)){
    if (j.del){ byId.delete(j.id); continue; }
    const base = byId.get(j.id) || {photos: 0};
    const unsent = j.newPhotos.filter(p => !p.sent).length;
    byId.set(j.id, {...base, ...j.rec, ...K.derive(j.rec), photos: (base.photos||0) + unsent - j.removed.length, pending: true, needs: j.error || ""});
  }
  return [...byId.values()].sort((a,b) => K.sortKey(b).localeCompare(K.sortKey(a)));
}

$("view").addEventListener("click", async ev => {
  const K = KINDS[S.view];
  if (!K) return;
  const st = RS(K.kind);
  const a = ev.target.closest("[data-act]");
  if (!a) return;
  const act = a.dataset.act;
  if (act === "retry"){ processQueue(); return; }
  if ((act === "new" || act === "edit") && !(await canEdit())) return;
  if (act === "new"){
    const draft = await kvGet("draft:" + K.kind) || (K.kind === "dayworks" ? await kvGet("dwDraft") : null);
    const rec = draft && draft.rec ? {...draft.rec} : {...K.blank(), id: newRecId(K)};
    if (!rec.id || !rec.id.startsWith(K.prefix)) rec.id = newRecId(K);
    if (K.kind === "dayworks"){
      rec._strict = true; rec._isNew = true;
      if (!rec.x_ref) rec.x_ref = nextRef(rec.type);
      if (!rec.x_co) rec.x_co = "JJ Rhatigan";
      if (!rec.x_status) rec.x_status = REC_STATUS[0];
    }
    await openRecForm(K, rec, true);
    if (draft && draft.rec){ st.form.added = draft.added || []; st.form.restored = true; render(); }
    return;
  }
  if (act === "open"){
    st.detail = a.dataset.id; st.view = "detail"; render(); window.scrollTo(0,0);
    await getRecPhotos(K.kind, st.detail); if (st.view === "detail") render();
    return;
  }
  if (act === "back"){
    if (st.view === "form" && st.form && !st.form.isNew){
      readRecForm(K);
      if (st.form.added.length || st.form.removed.length){
        if (!(await ask("Leave without saving your changes?", "Leave", true))) return;
      }
    }
    st.view = "list"; st.form = null; render(); return;
  }
  if (act === "edit"){
    const r = mergedRecords(K.kind).find(x => x.id === a.dataset.id);
    if (r) await openRecForm(K, r, false);
    return;
  }
  if (act === "pickname"){
    readRecForm(K);
    const f = st.form, name = a.dataset.name;
    const list = namesList(f.rec.other);
    const i = list.findIndex(x => x.toLowerCase() === name.toLowerCase());
    if (i >= 0) list.splice(i, 1); else list.push(name);
    f.rec.other = list.join(", ");
    saveRecDraft(K); render(); return;
  }
  if (act === "rmphoto"){
    readRecForm(K);
    const f = st.form, name = a.dataset.name;
    if (!(await ask("Remove this photo?", "Remove photo", true))) return;
    const i = f.added.findIndex(p => p.name === name);
    if (i >= 0) f.added.splice(i, 1); else if (!f.removed.includes(name)) f.removed.push(name);
    saveRecDraft(K); render(); return;
  }
  if (act === "delete"){
    const f = st.form;
    if (!(await ask(`Delete this ${K.one}? Its photos will be deleted too. This can't be undone.`, "Delete", true))) return;
    await queueRecordDelete(K.kind, f.rec.id);
    st.view = "list"; st.form = null; render(); return;
  }
});

// ================= Event Analysis Sheets (EAS) =================
// Same layout as the EAS sheets made for Mark Deevy (based on the DCOR sheet): logo, site and title bar, Date / EAS Nr.,
// Description of Works, Labour, Materials, Plant (unused rows crossed out), blank Signature, then a photo page.
const EAS_SITE = "Patrician Secondary School, Newbridge";
// Numbers already issued on EAS sheets before refs were added to the app. Kept fixed so they never change.
const EAS_ISSUED = {
  "dw-seed-001": 1, "dw-seed-002": 2, "dw-seed-003": 3, "dw-mu5g3ihu-ty1zd": 4, "dw-muay8xcb-anhck": 5, "dw-muayla51-xxl7w": 6,
  "dw-mucn5z55-0l6e3": 7, "dw-mugwkd6u-izfoe": 8, "dw-muqlcdms-kvv0p": 9, "dw-munzp3se-6s492": 10, "dw-muqmqrvz-tbsxo": 11,
  "dw-muqmycjc-sm0tj": 12, "dw-muqnnk1r-swj0b": 13, "dw-muqor3w3-6j77r": 14,
  "dw-mu6sm9q4-3fs8n": 1, "dw-mubbtnhl-7ft3q": 2, "dw-mue1a1qv-im6pm": 3, "dw-mumam3d5-c8qte": 4, "dw-muqq6gjy-abk82": 5,
};
const easType = r => (r.type === "Crane delay" ? "Crane delay" : "Variation");
function easNumbers(){
  // ref number if it has one, else the already-issued number, else next free number in date order
  const all = RS("dayworks").list ? mergedRecords("dayworks") : [];
  const out = {}, max = {"Variation": 0, "Crane delay": 0}, loose = [];
  for (const r of all){
    const t = easType(r), m = /^(?:VO|CD|DL)-(\d+)$/.exec(parseDet(r.description).det.ref || "");
    const n = m ? +m[1] : EAS_ISSUED[r.id];
    if (n){ out[r.id] = n; max[t] = Math.max(max[t], n); } else loose.push(r);
  }
  loose.sort((a, b) => (a.date + a.start + a.id).localeCompare(b.date + b.start + b.id))
    .forEach(r => { const t = easType(r); out[r.id] = ++max[t]; });
  return out;
}
const easDate = s => { const d = fromIso(s); return d ? `${d.getDate()}/${d.getMonth() + 1}/${String(d.getFullYear()).slice(2)}` : (s || ""); };
const easHrs = h => { const v = Math.round((+h || 0) * 100) / 100; return `${v} hr${v === 1 ? "" : "s"}`; };
const capFirst = s => { s = String(s || "").trim(); return s ? s[0].toUpperCase() + s.slice(1) : s; };
function easTradeShort(label){
  const t = String(label || "").toLowerCase();
  if (/chippy|carpenter/.test(t)) return "Carp";
  if (/fix/.test(t)) return "Fixer";
  if (/general|^go$/.test(t)) return "GO";
  return label || "";
}
function easLabour(r){
  const hrs = easHrs(dwHours(r));
  if (easType(r) === "Crane delay") return [["", "", "", r.start || "", r.end || "", hrs]];   // times only
  const left = {Carp: +r.chippies || 0, Fixer: +r.fixers || 0, GO: +r.operatives || 0};
  const rows = [];
  for (const full of namesList(r.other)){
    const lad = (S.lads || []).find(l => l.name && l.name.toLowerCase() === full.toLowerCase());
    let trade = lad ? easTradeShort(lad.trade) : "";
    if (!(trade in left) || left[trade] < 1) trade = Object.keys(left).find(k => left[k] > 0) || trade;
    if (trade in left && left[trade] > 0) left[trade]--;
    const parts = full.split(/\s+/);
    rows.push([parts.length > 1 ? parts.slice(0, -1).join(" ") : full, parts.length > 1 ? parts[parts.length - 1] : "", trade, r.start || "", r.end || "", hrs]);
  }
  for (const [trade, n] of Object.entries(left)) for (let i = 0; i < n; i++) rows.push(["", "", trade, r.start || "", r.end || "", hrs]);
  return rows;
}
function easDescription(r){
  const p = parseDet(r.description), d = p.det, out = [capFirst(p.work)];
  if (easType(r) === "Crane delay"){
    if (d.cause) out.push(`Cause: ${d.cause}${d.causeInfo ? ", " + d.causeInfo : ""}.`);
    if (d.cby) out.push(`Delay confirmed by ${d.cby}${d.co ? " (" + d.co + ")" : ""}.`);
    if (d.effect) out.push(`Knock-on effect: ${d.effect}.`);
  } else {
    if (d.why) out.push(`Reason: ${d.why}.`);
    if (d.drg) out.push(`Drawing / RFI: ${d.drg}.`);
    if (d.by || d.how) out.push(`Instructed${d.how ? " (" + d.how.toLowerCase() + ")" : ""}${d.by ? " by " + d.by : ""}${d.co ? ", " + d.co : ""}.${d.conf ? " Confirmed by email: " + d.conf + "." : ""}`);
    if (d.qty) out.push(`Quantities: ${d.qty}.`);
  }
  return out.filter(Boolean).map(s => s.replace(/\.\.$/, "."));
}
async function easPhotos(r){
  const st = RS("dayworks");
  const pics = {...(await getRecPhotos("dayworks", r.id))};
  const job = kindJobs("dayworks").find(j => j.id === r.id && !j.del);
  if (job){ job.newPhotos.forEach(p => pics[p.name] = p.data); job.removed.forEach(n => delete pics[n]); }
  const out = [];
  for (const n of Object.keys(pics).sort()){
    const im = await loadImg(pics[n]);
    if (!im) continue;
    try{
      const c = document.createElement("canvas"), s = Math.min(1, 1400 / Math.max(im.naturalWidth, im.naturalHeight));
      c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      out.push({url: c.toDataURL("image/jpeg", 0.82), w: c.width, h: c.height});
    }catch(e){}
  }
  return out;
}
function easPage(doc, r, num, logo){
  const NAVY = "#012060", PALE = "#DCE6F2", HEAD = "#F2F5FA", M = 15, W = 180, typ = easType(r);
  const font = (st, sz, col) => { doc.setFont("helvetica", st); doc.setFontSize(sz); doc.setTextColor(col || "#000000"); };
  doc.setDrawColor(NAVY); doc.setLineWidth(0.25);
  const cell = (x, y, w, h, fill) => { if (fill){ doc.setFillColor(fill); doc.rect(x, y, w, h, "FD"); } else doc.rect(x, y, w, h); };
  const put = (s, x, y, h, o) => doc.text(String(s), x, y + h / 2, {baseline: "middle", ...(o || {})});
  let y = 12;
  if (logo){ const lw = 50, lh = lw * logo.r; doc.addImage(logo.url, "PNG", M, y, lw, lh, "nbflogo", "FAST"); y += lh + 3; }
  else { font("bold", 16, NAVY); doc.text("NEW BRIDGE FORM", M, y + 6); y += 10; }
  // site + title bar
  doc.setLineWidth(0.35); cell(M, y, 110, 9); cell(M + 110, y, 70, 9, NAVY); doc.setLineWidth(0.25);
  font("bold", 10, NAVY); put(EAS_SITE, M + 2, y, 9);
  font("bold", 11, "#FFFFFF"); put("Event Analysis Sheet [EAS]", M + 145, y, 9, {align: "center"});
  y += 11;
  // date / EAS nr (EAS Nr. left blank for the QS)
  cell(M, y, 30, 8, PALE); cell(M + 30, y, 90, 8); cell(M + 120, y, 60, 8);
  font("bold", 9, NAVY); put("Date:", M + 2, y, 8); put("EAS Nr.", M + 122, y, 8);
  font("normal", 10); put(easDate(r.date), M + 32, y, 8);
  y += 10;
  // description
  cell(M, y, W, 7, PALE); font("bold", 10, NAVY); put("Description of Works:", M + 2, y, 7); y += 7;
  font("bold", 9.5); const head = doc.splitTextToSize(`${typ} ${num} - ${capFirst(r.location) || "Site"}.`, W - 4);
  font("normal", 9.5); const body = easDescription(r).flatMap(p => doc.splitTextToSize(p, W - 4));
  const lh = 4.2, dh = Math.max(24, 3 + (head.length + body.length) * lh + 2);
  cell(M, y, W, dh);
  let ty = y + 4.5;
  font("bold", 9.5); head.forEach(l => { doc.text(l, M + 2, ty); ty += lh; });
  font("normal", 9.5); body.forEach(l => { doc.text(l, M + 2, ty); ty += lh; });
  y += dh + 2.5;
  // labour / materials / plant
  const section = (title, heads, ws, rows, blankH) => {
    cell(M, y, W, 7, PALE); font("bold", 10, NAVY); put(title, M + 2, y, 7); y += 7;
    let x = M; heads.forEach((h, i) => { cell(x, y, ws[i], 6, HEAD); font("bold", 8.5, NAVY); put(h, x + 1.5, y, 6); x += ws[i]; }); y += 6;
    rows.forEach(rw => {
      x = M; rw.forEach((v, i) => { cell(x, y, ws[i], 6); font("normal", 9); put(doc.splitTextToSize(String(v), ws[i] - 3)[0] || "", x + 1.5, y, 6); x += ws[i]; }); y += 6;
    });
    x = M; ws.forEach(w => { cell(x, y, w, blankH); x += w; });
    doc.setLineWidth(0.3); doc.line(M, y, M + W, y + blankH); doc.setLineWidth(0.25);   // cross out the unused part
    y += blankH + 2.5;
  };
  const lab = easLabour(r);
  section("Labour", ["Name", "Surname", "Trade", "Start Time", "Finish Time", "Duration"], [34, 34, 22, 30, 30, 30], lab, Math.max(8, 40 - 6 * lab.length));
  const d = parseDet(r.description).det;
  const mats = d.mats ? [[d.mats, "", ""]] : [];
  section("Materials", ["Description", "Qty", "Comments"], [90, 25, 65], mats, Math.max(8, 24 - 6 * mats.length));
  const plantTxt = easType(r) === "Crane delay" ? d.pstand : d.plant;
  const plant = plantTxt ? [[plantTxt, "", ""]] : [];
  section("Plant", ["Description", "Qty", "Comments"], [90, 25, 65], plant, Math.max(8, 18 - 6 * plant.length));
  // signature, left blank
  cell(M, y, W, 7, PALE); font("bold", 10, NAVY); put("Signature", M + 2, y, 7); y += 7;
  [["Name", 70], ["Position", 55], ["Date", 55]].reduce((x, [h, w]) => { cell(x, y, w, 6, HEAD); font("bold", 8.5, NAVY); put(h, x + 1.5, y, 6); return x + w; }, M); y += 6;
  [70, 55, 55].reduce((x, w) => { cell(x, y, w, 12); return x + w; }, M);
}
function easPhotoPages(doc, r, num, logo, photos){
  if (!photos.length) return;
  const NAVY = "#012060", M = 15, typ = easType(r);
  const perPage = photos.length === 1 ? 1 : (photos.length <= 4 ? 4 : 6);
  for (let i = 0; i < photos.length; i += perPage){
    doc.addPage();
    let y = 12;
    if (logo){ const lw = 50, lh = lw * logo.r; doc.addImage(logo.url, "PNG", M, y, lw, lh, "nbflogo", "FAST"); y += lh + 6; }
    doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.setTextColor(NAVY); doc.text(`${typ} ${num} - Photographs`, M, y + 4); y += 9;
    doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.text(`${easDate(r.date)}  |  ${capFirst(r.location)}`, M, y + 2); y += 7;
    const set = photos.slice(i, i + perPage), cols = set.length === 1 ? 1 : 2;
    const bw = cols === 1 ? 160 : 88, bh = set.length === 1 ? 150 : (perPage === 4 ? 110 : 72);
    set.forEach((p, j) => {
      const s = Math.min(bw / p.w, bh / p.h), w = p.w * s, h = p.h * s;
      const cx = cols === 1 ? 105 : (j % 2 ? 105 + 46 : 105 - 46), top = y + Math.floor(j / cols) * (bh + 4);
      doc.addImage(p.url, "JPEG", cx - w / 2, top + (bh - h) / 2, w, h);
    });
  }
}
async function makeEasPdf(recs, fileName){

function easSorted(list){
